name: Android release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Android version without the android-v prefix, for example 1.0.0. The tag android-v<version> must exist.'
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the Android release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version && format('android-v{0}', inputs.version) || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nestwall-release.jks"

      - name: Build the signed release APK
        working-directory: mobile/android
        env:
          ORG_GRADLE_PROJECT_NESTWALL_KEYSTORE_FILE: ${{ runner.temp }}/nestwall-release.jks
          ORG_GRADLE_PROJECT_NESTWALL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_NESTWALL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_NESTWALL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Create the GitHub release and attach the APK
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          version="${VERSION#android-v}"
          tag="android-v$version"
          apk="mobile/android/app/build/outputs/apk/release/official-nestwall-${version}.apk"
          test -f "$apk"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --title "NestWall Android $version" --generate-notes
          gh release upload "$tag" "$apk" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Remove the decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/nestwall-release.jks"
