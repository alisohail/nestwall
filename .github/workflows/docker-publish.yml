name: Docker publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish without a prefix, for example 0.2.0. The tags nestwall-api-v<version> and nestwall-web-v<version> must exist.'
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve version
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="$INPUT_VERSION"
          if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be MAJOR.MINOR.PATCH, got '$v'" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  publish:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: nestwall-api
            context: backend
          - image: nestwall-web
            context: frontend
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ format('nestwall-api-v{0}', inputs.version) }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: tags
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IMAGE: ${{ matrix.image }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE"
          {
            echo "tags<<TAGS"
            echo "$image:$VERSION"
            echo "$image:${VERSION%.*}"
            echo "$image:latest"
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  release:
    needs: [version, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Create the GitHub releases if they do not exist
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for pair in "nestwall-api:NestWall API" "nestwall-web:NestWall Web"; do
            tag="${pair%%:*}-v$VERSION"
            title="${pair#*:} $VERSION"
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
              || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$title" --generate-notes
          done
