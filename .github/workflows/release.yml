name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'VERSION'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  bump:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      release: ${{ steps.check.outputs.release }}
      android_version: ${{ steps.android.outputs.version }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          # A PAT from an admin lets this push pass the main ruleset. The default token cannot.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Check for new commits
        id: check
        run: |
          last_tag=$(git describe --tags --abbrev=0 --match 'nestwall-api-v*' 2>/dev/null || true)
          count=$(git rev-list --count "${last_tag:+$last_tag..}HEAD")
          echo "New commits since ${last_tag:-the first commit}: $count"
          if [ "$count" -gt 0 ]; then echo "release=true" >> "$GITHUB_OUTPUT"; else echo "release=false" >> "$GITHUB_OUTPUT"; fi

      - name: Bump version from commits
        id: bump
        if: ${{ steps.check.outputs.release == 'true' }}
        run: echo "version=$(scripts/bump-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Bump Android version from mobile/android commits
        id: android
        if: ${{ steps.check.outputs.release == 'true' }}
        run: echo "version=$(scripts/bump-android-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Commit, tag and push
        if: ${{ steps.check.outputs.release == 'true' }}
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          ANDROID_VERSION: ${{ steps.android.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION frontend/package.json frontend/package-lock.json deploy/compose.yaml
          tags=("nestwall-api-v$VERSION" "nestwall-web-v$VERSION")
          if [ -n "$ANDROID_VERSION" ]; then
            git add mobile/android/VERSION
            tags+=("nestwall-android-v$ANDROID_VERSION")
          fi
          git commit -m "chore(release): v$VERSION [skip ci]"
          for tag in "${tags[@]}"; do git tag "$tag"; done
          git push origin HEAD:main "${tags[@]}"

  publish:
    needs: bump
    if: ${{ needs.bump.outputs.release == 'true' }}
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.bump.outputs.version }}
    permissions:
      contents: write
      packages: write

  android:
    needs: bump
    if: ${{ needs.bump.outputs.android_version != '' }}
    uses: ./.github/workflows/android-release.yml
    with:
      version: ${{ needs.bump.outputs.android_version }}
    secrets: inherit
    permissions:
      contents: write
