name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'VERSION'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  bump:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Check for new commits
        id: check
        run: |
          last_tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          count=$(git rev-list --count "${last_tag:+$last_tag..}HEAD")
          echo "New commits since ${last_tag:-the first commit}: $count"
          if [ "$count" -gt 0 ]; then echo "release=true" >> "$GITHUB_OUTPUT"; else echo "release=false" >> "$GITHUB_OUTPUT"; fi

      - name: Bump version from commits
        id: bump
        if: ${{ steps.check.outputs.release == 'true' }}
        run: echo "version=$(scripts/bump-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Commit, tag and push
        if: ${{ steps.check.outputs.release == 'true' }}
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION frontend/package.json frontend/package-lock.json deploy/compose.yaml
          git commit -m "chore(release): v$VERSION [skip ci]"
          git tag "v$VERSION"
          git push origin HEAD:main "v$VERSION"

  publish:
    needs: bump
    if: ${{ needs.bump.outputs.release == 'true' }}
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.bump.outputs.version }}
    permissions:
      contents: write
      packages: write
