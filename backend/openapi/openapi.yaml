      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      responses:
        '204':
          description: All sessions revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/permissions/catalogue:
    get:
      tags: [Permissions]
      summary: List every permission
      description: Requires the `roles.view` permission.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Permission catalogue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogueResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/family/time-format:
    put:
      tags: [Family]
      summary: Set the family's clock style
      description: Requires the `settings.manage` permission. Sets the 12-hour (AM/PM) or 24-hour clock for every member. Writes an audit entry.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [time_format]
              properties:
                time_format:
                  type: string
                  enum: ['12h', '24h']
      responses:
        '200':
          description: Saved clock style
          content:
            application/json:
              schema:
                type: object
                required: [time_format]
                properties:
                  time_format:
                    type: string
                    enum: ['12h', '24h']
        '400':
          description: Value is not `12h` or `24h` (error code `invalid_time_format`)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/family/timezone:
    put:
      tags: [Family]
      summary: Set the family's timezone
      description: Requires the `settings.manage` permission. Sets the IANA timezone used for the family's dates, due times, weather and wall clock. Writes an audit entry.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timezone]
              properties:
                timezone:
                  type: string
                  example: Europe/Berlin
      responses:
        '200':
          description: Saved timezone
          content:
            application/json:
              schema:
                type: object
                required: [timezone]
                properties:
                  timezone:
                    type: string
        '400':
          description: Value is not a valid IANA timezone (error code `invalid_timezone`)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/family/roles:
    get:
      tags: [Permissions]
      summary: List roles and their permissions
      description: Requires the `roles.view` permission.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRolesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Permissions]
      summary: Create a custom role
      description: Requires the `roles.manage` permission. Fixed roles (Parent) cannot be created or changed. A custom role limit of 2 applies to all roles (roles are not per family); a third returns 409 `role_limit`. Names are unique, ignoring case.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '201':
          description: Role created
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/family/roles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Permissions]
      summary: Delete a custom role
      description: Requires the `roles.manage` permission. Only custom roles can be deleted. Built-in roles return `built_in_role` and the Parent role returns `parent_locked`. A role that a member still uses returns `role_in_use`. Optional `If-Match` works as on the permissions write.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Role deleted
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The role is the Parent or a built-in role, or it is still in use (`parent_locked`, `built_in_role`, `role_in_use`).
        '412':
          $ref: '#/components/responses/VersionConflict'
  /api/v1/family/roles/{id}/permissions:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Permissions]
      summary: Set a role's permissions
      description: Requires the `roles.manage` permission. Each value is one of `full`, `view`, `own`, `request`, `allowed`, `denied`. Send the role's last known `version` in `If-Match` to reject a stale write with 412.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPermissionsRequest'
      responses:
        '200':
          description: Permissions updated. Returns the new version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/VersionConflict'
  /api/v1/family/roles/{id}/reset:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Permissions]
      summary: Reset a role to its default permissions
      description: Requires the `roles.manage` permission. Optional `If-Match` works as on the permissions write.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Role reset. Returns the new version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/VersionConflict'
  /api/v1/family/members/{id}/permissions:
    parameters:
      - $ref: '#/components/parameters/MemberID'
    get:
      tags: [Permissions]
      summary: Read a member's effective permissions
      description: Requires the `roles.view` permission.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Effective permissions and overrides. The ETag header carries the overrides version.
          headers:
            ETag:
              description: Quoted overrides version, for example "2". Send it back in If-Match.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPermissionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Permissions]
      summary: Set a member's permission overrides
      description: Requires the `roles.manage` permission. Overrides take priority over the role. Parent-only codes can be set only on a co_parent member, and only the co-parent set. A non-parent actor gets 403 `parent_only` if the request changes any parent-only override. Send the version from the ETag header in `If-Match` to reject a stale write with 412.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPermissionsRequest'
      responses:
        '200':
          description: Overrides saved. Returns the new version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/VersionConflict'
  /api/v1/notifications:
    get:
      tags: [Notifications]
      summary: List the caller's notifications
      description: Any signed-in user, including children, can read their own notifications. Unread items come first; at most 50 are returned. `browser_enabled` tells the client whether the family allows browser alerts.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Notifications, the unread count and the browser alert setting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListNotificationsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Notifications]
      summary: Clear all of the caller's notifications
      description: Any signed-in user can delete their own notifications. Other members' notifications are never touched.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      responses:
        '204':
          description: All of the caller's notifications were deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/notifications/stream:
    get:
      tags: [Notifications]
      summary: Stream notification changes
      description: |
        Server-sent events for the caller's inbox. The server sends `event: changed` with no data when the caller's
        notifications change, so the client reloads the list through `GET /api/v1/notifications`. The event data is an
        empty object. Heartbeat comment lines keep idle connections open. The stream carries no notification content.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: An open event stream
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/notifications/settings:
    get:
      tags: [Notifications]
      summary: Get the family's notification settings
      description: Requires the `settings.view` permission. One setting for the whole family, covering in-app, browser and email delivery, the email digest switch and the email HTML template. Shipped defaults are in-app on, browser on, email off and digest off.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Family notification settings and the default email template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettingsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Notifications]
      summary: Save the family's notification settings
      description: Requires the `settings.manage` permission. All four switches are required. Turning email on requires SMTP to be enabled and ready (`smtp_not_ready` otherwise). An empty or default template is stored as an empty string, which means the built-in template is used.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationSettingsRequest'
      responses:
        '200':
          description: Saved family notification settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettingsResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Email cannot be turned on until SMTP is ready (`smtp_not_ready`)
  /api/v1/notifications/settings/preview:
    post:
      tags: [Notifications]
      summary: Preview the email template
      description: Requires the `settings.manage` permission. Renders the given template with sample content and the family name. Nothing is saved.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email_template]
              additionalProperties: false
              properties:
                email_template: { type: string }
      responses:
        '200':
          description: Rendered HTML
          content:
            application/json:
              schema:
                type: object
                required: [html]
                properties:
                  html: { type: string }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/settings/email:
    get:
      tags: [Settings]
      summary: Get the family's SMTP settings
      description: Requires the `settings.view` permission. The password is never returned; `password_set` says whether one is saved. `ready` is true when email is on and the server and sender address are set.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: SMTP settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  host: { type: string }
                  port: { type: integer, minimum: 1, maximum: 65535 }
                  security: { type: string, enum: [starttls, tls] }
                  username: { type: string }
                  from_address: { type: string }
                  from_name: { type: string }
                  send_limit_per_hour: { type: integer, minimum: 1, maximum: 1000 }
                  password_set: { type: boolean }
                  ready: { type: boolean }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Settings]
      summary: Save the family's SMTP settings
      description: Requires the `settings.manage` permission. A missing `password` keeps the saved one, an empty string clears it, and any other value replaces it. The password is sealed at rest. Turning email on requires a host and a sender address.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, host, port, security, from_address]
              properties:
                enabled: { type: boolean }
                host: { type: string, maxLength: 253 }
                port: { type: integer, minimum: 1, maximum: 65535 }
                security: { type: string, enum: [starttls, tls] }
                username: { type: string, maxLength: 254 }
                password: { type: string, maxLength: 512, writeOnly: true }
                from_address: { type: string, maxLength: 254 }
                from_name: { type: string }
                send_limit_per_hour: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        '200':
          description: Saved SMTP settings (same shape as GET)
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/settings/email/test:
    post:
      tags: [Settings]
      summary: Send a test email to the signed-in user
      description: Requires the `settings.manage` permission. Sends synchronously because the user is waiting for the result, bounded by a 15 second timeout. The signed-in account must have an email address.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      responses:
        '204':
          description: The mail server accepted the message
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Email is not ready (`smtp_not_ready`) or the account has no email address (`no_email`)
        '502':
          description: The mail server refused the message or the sign-in (`send_failed`). The response never contains the password.
  /api/v1/notifications/{id}/read:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Notifications]
      summary: Mark a notification as read
      description: Any signed-in user. Idempotent. Only the recipient can mark their own notification.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      responses:
        '204':
          description: Marked as read
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/dashboard/parent:
    get:
      tags: [Dashboard]
      summary: Get the parent dashboard
      description: Requires the `tasks.view` permission, so children get 403. Every number comes from task records. "Today" is the date in the family's time zone. Today and coming up list one entry per person's copy (skipped copies are left out). Approvals hold up to 10 submitted copies, oldest first. Activity holds the 10 latest task events from the audit log. Points are not included until the points milestone.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParentDashboard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/integrations/summary:
    get:
      tags: [Integrations]
      summary: Get the integration summary for dashboards and Home Assistant
      description: Authenticate with an API token that carries both the `tasks:read` and `calendar:read` scopes. Without both scopes the call gets 403. The token owner must still hold the matching permissions (`tasks.view` and `calendar.view`). Data is wrapped in `data`. Task counts come from the parent dashboard. `next_events` lists up to 5 occurrences from today over the next 7 days, soonest first. Dates use the family's time zone.
      security:
        - apiToken: []
      responses:
        '200':
          description: Integration summary
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      date:
                        type: string
                        format: date
                      timezone:
                        type: string
                      tasks_due_today:
                        type: integer
                      tasks_done_today:
                        type: integer
                      tasks_overdue:
                        type: integer
                      tasks_waiting_approval:
                        type: integer
                      events_today:
                        type: integer
                      next_events:
                        type: array
                        items:
                          type: object
                          properties:
                            title:
                              type: string
                            date:
                              type: string
                              format: date
                            starts_at:
                              type: string
                              format: date-time
                            all_day:
                              type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/me/tasks:
    get:
      tags: [Tasks]
      summary: Get the caller's own task copies for the Today, Catch up and Waiting screens
      description: Requires the `tasks.view` permission. Only the caller's own copies are returned, and skipped copies are left out. "Today" is the date in the family's time zone. Today holds open copies due today. Catch-up holds open copies that are past due, up to 30 days back. Waiting holds submitted copies. Coming up and Done are paged through their own endpoints. Missed copies count toward today's total but appear in no list. The streak counts back up to 366 days; today is neutral until its copies are all done. Points are not included until the points milestone.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The caller's copies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyTasksResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/me/tasks/coming:
    get:
      tags: [Tasks]
      summary: Get one page of the caller's coming-up copies
      description: Requires the `tasks.view` permission. Only the caller's own copies are returned. Open copies due in the next 7 days after today, earliest first, ordered by due time then task ID. Pass next_cursor back as cursor to read the next page; it is null on the last page.
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size from 1 to 200. Defaults to 50.
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: cursor
          in: query
          required: false
          description: Cursor returned as next_cursor by the previous page.
          schema:
            type: string
      responses:
        '200':
          description: One page of coming-up copies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyTasksPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/me/tasks/done:
    get:
      tags: [Tasks]
      summary: Get one page of the caller's done copies
      description: Requires the `tasks.view` permission. Only the caller's own copies are returned. Approved copies from the last 7 days, newest first, ordered by due time then task ID. Pass next_cursor back as cursor to read the next page; it is null on the last page.
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size from 1 to 200. Defaults to 50.
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: cursor
          in: query
          required: false
          description: Cursor returned as next_cursor by the previous page.
          schema:
            type: string
      responses:
        '200':
          description: One page of done copies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyTasksPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/audit/logs:
    get:
      tags: [Audit]
      summary: List audit log entries for the caller's family
      description: Requires the `audit.view` permission.
      security:
        - sessionCookie: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: action
          in: query
          schema:
            type: string
        - name: target_type
          in: query
          schema:
            type: string
        - name: target_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Audit entries, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/family/members/{id}/points:
    post:
      tags: [Points]
      summary: Grant a bonus, take a penalty or post an adjustment for a member
      description: |
        Requires the `rewards.manage` permission. The `Idempotency-Key` header is required. A replay with the same key and member and type returns 200 with the stored row; the same key with another member or type returns 409 `idempotency_conflict`. A penalty is capped at the member's balance unless the family setting `points.allow_negative_balance` is `true`; the capped amount is recorded. A penalty at a zero balance (with the setting off) returns 409 `nothing_to_penalise` and writes nothing. A replay compares the member and type only, so a capped penalty can be replayed with a different amount.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/MemberID'
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-generated key, up to 100 characters. Reuse it only when retrying the same change.
          schema:
            type: string
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PointsChangeRequest'
      responses:
        '200':
          description: Replay of an earlier change with the same key; the stored row is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PointsEntryResponse'
        '201':
          description: Change posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PointsEntryResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/points/entries/{id}/reverse:
    post:
      tags: [Points]
      summary: Reverse a penalty with a compensating entry
      description: Requires the `rewards.manage` permission. Each penalty can be reversed once. The reversal is a positive entry that refers to the penalty. Returns 409 `not_a_penalty` for other entry types and 409 `already_reversed` on a second attempt.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
        - name: id
          in: path
          required: true
          description: Ledger entry ID of the penalty.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReversePenaltyRequest'
      responses:
        '201':
          description: Reversal posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PointsEntryResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/me/points:
    get:
      tags: [Points]
      summary: Points for the signed-in member
      description: |
        Requires the `rewards.view` permission. Always describes the caller, child or parent. `balance` is the spendable total after points held by pending requests; `reserved` is the points those requests hold. `week` holds points earned per local day in the family time zone, Monday first, and `today` is the index of the current day in `week`. Earned types are task awards, bonus task awards, bonuses and transfers in.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Points summary for the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyPointsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/me/badges:
    get:
      tags: [Badges]
      summary: Badges for the signed-in child
      description: |
        Requires the `rewards.view` permission. Always describes the caller. Only the child's own records are returned. A built-in badge that is switched off and not yet earned is left out, so a group that is off with nothing earned is left out too. Earned badges stay visible. `progress` is capped at `target` and equals `target` once earned. `from_parents` lists custom badges the caller was given by hand. `earned_count` and `total_count` include those awards.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Badges for the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyBadges'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/points/entries:
    get:
      tags: [Points]
      summary: List points ledger entries
      description: |
        Requires the `rewards.view` permission. A child sees only their own entries and may not pass another `member_id` (403). A parent may filter by `member_id`. Results are newest first and paged by keyset: pass `next_cursor` from the previous page as `cursor`. An unknown cursor returns 400.
      security:
        - sessionCookie: []
      parameters:
        - name: member_id
          in: query
          required: false
          description: Parents only. Limits the list to one member.
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          required: false
          description: Limits the list to one ledger entry type.
          schema:
            type: string
            enum: [task_award, bonus_task_award, bonus, penalty, redemption, redemption_reversal, reversal, adjustment, transfer_out, transfer_in]
        - name: from
          in: query
          required: false
          description: First day to include, YYYY-MM-DD in the family time zone (inclusive).
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Last day to include, YYYY-MM-DD in the family time zone (inclusive).
          schema:
            type: string
            format: date
        - name: limit
          in: query
          required: false
          description: Page size, 1 to 200. Default 50.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` value of the previous page.
          schema:
            type: string
      responses:
        '200':
          description: One page of entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PointsEntryPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/points/balances:
    get:
      tags: [Points]
      summary: List each active child's points balance
      description: |
        Parents only. A child gets 403. Returns each active child in the family, by name. `balance` and `reserved` follow the rules of `GET /api/v1/me/points`.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Balances for each active child
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberBalancesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/points/share:
    get:
      tags: [Sharing]
      summary: Get the sharing policy and the caller's sharing status
      description: Requires the `rewards.view` permission. Returns the family's sharing policy, the caller's balance, what the caller has sent today and the preset notes. Sharing is off until a parent turns it on; until then the default policy is returned with `version` 0. The response carries an `ETag` header with the policy version.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Sharing status, with the policy ETag
          headers:
            ETag:
              description: The policy version, quoted.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Sharing]
      summary: Send points to a sibling
      description: |
        Requires the `points.share` permission, which children hold and parents do not (parents get 403 `children_only`). The `Idempotency-Key` header is required. Amount is from the family's fewest per share (`min_per_share`) to its most (`max_per_share`). The sender must stay at or above the minimum balance and within the daily limit. When the approval rule applies, the share waits as pending and the recipient receives nothing until a parent approves; the sender's points are held from the request. A repeated key from the same sender returns the stored share with 200 and moves no points. The same key with a different request returns 409 `idempotency_conflict`.

        Error codes: 409 `sharing_disabled`; 409 `daily_limit_reached` (body has `remaining`); 409 `below_minimum_balance` (body has `balance` and `min_balance`); 404 `member_not_found`; 400 `validation_failed` with field `amount` when the amount is outside the family range (body has `min` and `max`); 400 `validation_failed` with field `to_member_id` for yourself or a non-child member.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
        - name: Idempotency-Key
          in: header
          required: true
          description: Unique per share from this child, up to 100 characters. Reuse it only to retry the same share.
          schema:
            type: string
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareRequest'
      responses:
        '200':
          description: Replayed share. Nothing new was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareResult'
        '201':
          description: Share created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareResult'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/points/share/settings:
    put:
      tags: [Sharing]
      summary: Replace the sharing policy
      description: Requires the `rewards.manage` permission. The body replaces the whole policy. `approval_mode` is `never`, `above` (a share above `approval_above` waits for a parent) or `always`. Send `If-Match` with the current version to avoid overwriting a newer change; a stale value returns 412 `version_conflict`. The response carries the new ETag.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareSettingsRequest'
      responses:
        '200':
          description: Saved policy, with the new ETag
          headers:
            ETag:
              description: The new policy version, quoted.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareSettings'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/VersionConflict'
  /api/v1/point-shares:
    get:
      tags: [Sharing]
      summary: List shares waiting for a parent
      description: Requires the `rewards.approve` permission. Lists the family's shares in the pending state, with the names the parents see.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Pending shares
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareListPage'
        '401':
