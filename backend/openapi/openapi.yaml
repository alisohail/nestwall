        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/VersionConflict'
    delete:
      tags: [Tasks]
      summary: Delete a task template
      description: Requires the `tasks.manage` permission. A template that tasks were created from cannot be deleted. The response is 409 with error code template_in_use and params `tasks` (the count). Send `If-Match` with the current version to avoid deleting a newer version.
