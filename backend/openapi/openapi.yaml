      description: Requires the `tasks.manage` permission. Creates a repeat series from the task fields plus `recurrence_rule`, then generates occurrences for the next 60 days. Each occurrence is a task with its own ID. Unsupported rules return 400 validation_failed. `first_task` is null when the series starts after the 60-day window.
