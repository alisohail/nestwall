        schema:
          type: string
          format: uuid
    post:
      tags: [Bonus]
      summary: Claim a bonus task
      description: Requires the bonus.grab permission. A parent is refused with children_only. Claiming a task the child already holds replays the claim with 200 and replayed set to true, and a new claim returns 201. A first_come task held by another child returns 409 taken. A task returns 409 not_open before show_from and 409 expired at or after ends_at. A task not offered to the caller returns 404. The response carries an ETag with the claim version.
      security:
        - sessionCookie: []
