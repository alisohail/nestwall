          type: boolean
          description: True when the task has no claims, is not cancelled and has not ended. Parent view only.
        eligible_member_ids:
          type: array
          items:
            type: string
            format: uuid
        claims:
          type: array
          description: Every claim on the task. Parent view only.
          items:
            $ref: '#/components/schemas/BonusClaim'
        my_claim:
          nullable: true
          description: The caller's own claim. Child view only.
          allOf:
            - $ref: '#/components/schemas/BonusClaim'
