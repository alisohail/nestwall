  /api/v1/tasks:
    get:
      tags: [Tasks]
      summary: List one-off tasks
      description: Requires the `tasks.view` permission. At full or view level it returns every copy of each task. At own level it returns only the caller's own copy. Without the permission the response is 403. Each item is one person's copy of a task, with that person's `member_id` and `status`. Items are ordered by due time, then by assignment. Archived tasks are hidden unless `archived=true`. Send the `next_cursor` value from one page as `cursor` to get the next page.
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size from 1 to 200. Defaults to 50.
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: cursor
          in: query
          required: false
          description: Cursor returned as next_cursor by the previous page.
          schema:
            type: string
        - name: member
          in: query
          required: false
          description: Only copies for this family member.
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          description: Only copies with this status.
          schema:
            type: string
            enum: [to_do, submitted, approved, rejected, skipped]
        - name: expired
          in: query
          required: false
          description: When true, only to-do or rejected copies whose occurrence was missed (ran out of time). These cannot be completed any more.
          schema:
            type: boolean
        - name: category
          in: query
          required: false
          description: Only tasks in this category.
          schema:
            type: string
            format: uuid
        - name: priority
          in: query
          required: false
          schema:
            type: string
            enum: [low, normal, high]
        - name: due_from
          in: query
          required: false
          description: Only tasks due on or after this date (YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: due_to
          in: query
          required: false
          description: Only tasks due on or before this date (YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: archived
          in: query
          required: false
          description: Omit or send false for active tasks, true for archived tasks.
          schema:
            type: string
            enum: [ 'false', 'true']
      responses:
        '200':
          description: A page of task copies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTasksResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Tasks]
      summary: Create a one-off task
      description: Requires the `tasks.manage` permission. Fields that are absent or null take the value from the template (if `template_id` is sent), then the category, then the family defaults; fields in the request win. After that `title`, `due_date`, `points` and at least one assignee are required. A task with no `due_time` is due at 23:59:59 in the family time zone. The response carries an `ETag` header with the task version.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRequest'
      responses:
        '201':
          description: Task created, with its ETag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Task UUID.
        schema:
          type: string
          format: uuid
    get:
      tags: [Tasks]
      summary: Read a one-off task
      description: "Requires the `tasks.view` permission. At own level, the task is shown only if the caller is an assignee, and `assignees` lists only the caller. The optional `member_id` query names the copy whose `checklist` is returned (default: the first assignee's copy). The response carries an `ETag` header with the task version."
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The task, with its ETag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Tasks]
      summary: Update a one-off task
      description: Requires the `tasks.manage` permission. Only the fields sent are changed; a null field clears it. Sending `assignee_ids` replaces the assignees. A removed person's copy is deleted even if they already acted on the task; points they earned stay in the ledger. Archived tasks cannot be changed (409 task_archived). Send `If-Match` with the current version to avoid overwriting a newer change.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskPatchRequest'
      responses:
        '200':
          description: Updated task, with the new ETag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The task is archived (task_archived).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          $ref: '#/components/responses/VersionConflict'
    delete:
      tags: [Tasks]
      summary: Permanently delete an archived one-off task
      description: "Requires the `tasks.manage` permission. Only archived tasks can be deleted; an active task returns 409 task_not_archived, so archive it first. Deleting removes the whole task: every assignee's copy, its checklists and its completion history, for every day of a repeating task. Points already awarded stay in the points ledger. Send `If-Match` with the current version to avoid deleting a task that changed. Records a task.deleted audit entry."
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Task deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The task is not archived (task_not_archived)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          $ref: '#/components/responses/VersionConflict'
  /api/v1/tasks/{id}/archive:
    parameters:
      - name: id
        in: path
        required: true
        description: Task UUID.
        schema:
          type: string
          format: uuid
    post:
      tags: [Tasks]
      summary: Archive a one-off task
      description: Requires the `tasks.manage` permission. Archiving hides the task from the default list and blocks further changes. Tasks are archived, not deleted, so the points ledger stays intact. Archiving a task that is already archived returns 409 task_archived.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      responses:
        '200':
          description: Archived task, with its new ETag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already archived (task_archived)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/tasks/{id}/unarchive:
    parameters:
      - name: id
        in: path
        required: true
        description: Task UUID.
        schema:
          type: string
          format: uuid
    post:
      tags: [Tasks]
      summary: Restore an archived one-off task
      description: Requires the `tasks.manage` permission. Puts an archived task back to its state before archiving. Only tasks archived as a whole can be restored. A task whose series was split or edited by a recurrence change is refused with 409 task_not_restorable, and an active task returns 409 task_not_archived. Send `If-Match` with the current version to avoid restoring a task that changed. Records a task.restored audit entry.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      responses:
        '200':
          description: Restored task, with its new ETag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The task is not archived (task_not_archived) or cannot be restored (task_not_restorable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          description: The If-Match version is stale (version_conflict)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/tasks/{id}/remove-person:
    parameters:
      - name: id
        in: path
        required: true
        description: Task UUID (the occurrence the person is removed from).
        schema:
          type: string
          format: uuid
    post:
      tags: [Tasks]
      summary: Take one person off a task
      description: Requires the `tasks.manage` permission. Removes only the named person; everyone else keeps the task. `scope` `occurrence` removes them from this day only. `scope` `series` (repeating tasks only) also stops new repeats for them and deletes all their copies from today on, in the definition's time zone, whatever their status; their copies before today are kept. Points already earned stay in the ledger. For a one-off task, removing the last person archives the task. Removing the last person from a repeating task archives the whole series. Send `If-Match` with the current version to avoid overwriting a newer change.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [member_id, scope]
              properties:
                member_id:
                  type: string
                  format: uuid
                scope:
                  type: string
                  enum: [occurrence, series]
      responses:
        '200':
          description: Updated task, with its new ETag (or archived, when the last person was removed)
          headers:
            ETag:
              description: The new task version, quoted.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The task, the person on it, or (for scope occurrence) the person's copy of this day was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The task is archived (task_archived).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          $ref: '#/components/responses/VersionConflict'
  /api/v1/tasks/{id}/complete:
    parameters:
      - name: id
        in: path
        required: true
        description: Task UUID.
        schema:
          type: string
          format: uuid
    post:
      tags: [Tasks]
      summary: Complete a member's copy of a one-off task
      description: Requires the `tasks.complete` permission. With no body it acts on the caller's own copy. An optional body `{member_id}` names another member's copy; that requires `tasks.manage` (403 forbidden otherwise), so a parent can complete a child's copy on their behalf. The same approval rules apply. When the task needs approval the copy becomes `submitted` and waits for a parent. Otherwise it is `approved` at once. A `rejected` copy can be completed again. Completing after the due time is recorded as late. Refused with 409 `checklist_incomplete` (params.remaining) while that copy's checklist items are unticked, with 409 `task_not_due` (params.due_date) when the caller finishes their own copy before its due date, and with 409 `task_missed` once the time to complete has passed. Send `If-Match` with the current version to avoid overwriting a newer change.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
