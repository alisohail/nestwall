      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Updated task, with its new ETag
