      summary: Unassign a bonus claim
      description: Requires the bonus.manage permission. Removes the child from a claim that is claimed, submitted or rejected. The claim stays in the history as released, the task reopens for the other eligible children, and no points are posted. Send the claim version as If-Match. An approved or released claim returns 409 wrong_state. The response is 200 with the claim and its ETag.
      security:
