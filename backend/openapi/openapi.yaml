    BonusTaskRequest:
      type: object
      additionalProperties: false
      description: Publish body. When template_id is sent, the template prefills the fields that are absent or null.
      properties:
        template_id:
          type: string
          format: uuid
          nullable: true
          description: A bonus template in the same family.
        day:
          type: string
          format: date
          nullable: true
          description: Family-local day the task belongs to, YYYY-MM-DD. Defaults to today. Must be today or later.
        title:
          type: string
          maxLength: 200
          nullable: true
          description: Required unless a template supplies it.
        description:
          type: string
          maxLength: 2000
          nullable: true
        points:
          type: integer
          maximum: 100000
          nullable: true
        claim_mode:
          type: string
          enum: [first_come, everyone_once]
          nullable: true
          description: first_come lets one child hold the task at a time. everyone_once lets each eligible child claim it once.
        approval_required:
          type: boolean
          nullable: true
        show_from:
          type: string
          format: date-time
          nullable: true
          description: Time the task opens. Before it the task is scheduled and cannot be claimed.
        ends_at:
          type: string
          format: date-time
          nullable: true
          description: Time the task ends. Defaults to the end of the family-local day.
        eligible_member_ids:
          type: array
          maxItems: 50
          description: Active children of the family. Required.
          items:
            type: string
            format: uuid
