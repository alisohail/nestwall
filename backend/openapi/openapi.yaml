  /api/v1/auth/forgot-password/email:
    post:
      tags: [Auth]
      summary: Request a password reset by email
      description: A parent enters the email address on their account. The response is the same shape whether or not the address matches an account. When it matches an active parent and email is set up for that family, a single-use link valid for 30 minutes is emailed and any older link stops working. When email is not set up for any family, the response is `email_not_set_up` and nothing is recorded. That status reveals that no family has email set up, but not whether an address exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordEmailRequest'
      responses:
        '202':
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/reset-password:
    post:
      tags: [Auth]
      summary: Set a new password with an emailed reset link
      description: Public. The single-use token from the emailed link is the only credential. A valid link sets the new password, clears the must-change flag, signs out every session and records an audit entry. The link is spent in the same step, so it cannot be used twice. The user signs in again with the new password. Any link that is unknown, used or expired returns 400 `reset_link_invalid`. A weak password returns a validation error and leaves the link usable. Requests are rate limited per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletePasswordResetRequest'
      responses:
        '204':
          description: Password changed. Every session is signed out.
        '400':
          description: Invalid link (`reset_link_invalid`) or invalid password (validation failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
