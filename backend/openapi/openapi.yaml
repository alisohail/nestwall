            schema:
              $ref: '#/components/schemas/BonusTaskRequest'
      responses:
        '201':
          description: Task published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BonusTask'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/bonus-tasks/{id}:
    parameters:
