      type: object
      required: [id, title, points, claim_mode, approval_required, day, ends_at, state, version, editable, eligible_member_ids]
      properties:
        id:
          type: string
          format: uuid
        template_id:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        description:
          type: string
          nullable: true
        points:
