openapi: 3.0.3
info:
  title: NestWall API
  version: 1.0.0
  description: |
    API for the NestWall family planner.

    Authentication uses an HttpOnly session cookie (`nestwall-session`). Every
    state-changing request (POST, PUT, PATCH, DELETE) must also send the value of
    the `nestwall-csrf` cookie in the `X-CSRF-Token` header (double-submit CSRF).
    The cookie is issued on the first request if missing.
servers:
  - url: /
    description: Relative to the deployed host (nginx proxies /api/ to the API)
  - url: http://localhost:8080
    description: Local development through compose (web port)
tags:
  - name: Health
  - name: Setup
  - name: Auth
  - name: Family
  - name: Audit
  - name: Dashboard
  - name: Points
  - name: Rewards
  - name: Redemptions
  - name: Sharing
  - name: Badges
  - name: Bonus
  - name: Integrations
paths:
  /api/v1/health/live:
    get:
      tags: [Health]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Service is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: UP
                  time:
                    type: string
                    format: date-time
  /api/v1/health/ready:
    get:
      tags: [Health]
      summary: Readiness probe (checks the database)
      security: []
      responses:
        '200':
          description: Service and database are ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: READY
        '503':
          description: Database is not reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/setup/status:
    get:
      tags: [Setup]
      summary: Check whether first-run setup is required
      security: []
      responses:
        '200':
          description: Setup status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatusResponse'
  /api/v1/setup/parent:
    post:
      tags: [Setup]
      summary: Create the first parent, family and session
      description: Only succeeds while no family exists. Sets the session cookie on success.
      security: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupParentRequest'
      responses:
        '201':
          description: Setup complete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupParentResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/CSRFInvalid'
        '409':
          description: Setup already complete, or user ID taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Log in with user ID and password
      security: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in; session cookie set
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Missing user ID or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/CSRFInvalid'
        '429':
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204':
          description: Session revoked; cookies cleared
        '403':
          $ref: '#/components/responses/CSRFInvalid'
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Return the current user and family memberships
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/family/members:
    get:
      tags: [Family]
      summary: List family members
      description: Requires the `members.view` permission. Only active members are returned unless `include_inactive=true` is passed, which also returns deactivated members. Removed members are never returned.
      security:
        - sessionCookie: []
      parameters:
        - name: include_inactive
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Also return deactivated (inactive) members. Used by the Family page.
      responses:
        '200':
          description: Members of the caller's family
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMembersResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Family]
      summary: Add a family member
      description: Adds a member with any role. Only the Child role sets the child flag. Requires the `members.manage` permission.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMemberRequest'
      responses:
        '201':
          description: Member created
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: User ID already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/family/members/{id}:
    parameters:
      - $ref: '#/components/parameters/MemberID'
    put:
      tags: [Family]
      summary: Update a family member
      description: Requires the `members.manage` permission. Changing a fixed role is not allowed. Only a parent can change a parent account, or assign or change a co-parent role; otherwise 403 `parent_only`. Changing a member's role removes any parent-only overrides the new role type cannot hold. The last active parent cannot be deactivated (`last_parent`). A caller cannot deactivate their own account (`cannot_deactivate_self`). A `user_id` already used by another account returns `user_id_taken`. An email already used by another account (case-insensitive) returns `email_taken`. A PIN can only be set for child accounts (`invalid_target` otherwise). Credential changes are recorded in the audit log as flags, never as values.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRequest'
      responses:
        '204':
          description: Member updated
        '400':
          description: Invalid member ID, role, or field value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Family]
      summary: Remove a family member
      description: Requires the `members.manage` permission. Hard-deletes the member together with their points history, badges, redemptions and task assignments, and revokes their sessions. Other members' ledger rows that named this member as actor keep their amount with the actor cleared. The last active parent cannot be removed. A caller cannot remove their own account (`cannot_remove_self`).
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      responses:
        '204':
          description: Member removed
        '400':
          description: Invalid member ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/family/members/{id}/avatar:
    parameters:
      - $ref: '#/components/parameters/MemberID'
    post:
      tags: [Family]
      summary: Upload or replace a profile picture
      description: Requires the `profile.avatar.change` permission. A member can change their own picture only when `members_can_change_avatar` is on; otherwise a `members.manage` holder is needed. Accepts JPEG or PNG up to 5 MB (animated PNG and SVG are rejected). The picture is cropped to a square and re-encoded as 256 px and 96 px JPEG, so EXIF metadata is removed.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                x:
                  type: integer
                  minimum: 0
                  description: Crop left edge in pixels (default 0).
                y:
                  type: integer
                  minimum: 0
                  description: Crop top edge in pixels (default 0).
                size:
                  type: integer
                  minimum: 1
                  description: Crop side in pixels (default is the largest centred square).
      responses:
        '200':
          description: Picture stored; the previous picture is removed
          content:
            application/json:
              schema:
                type: object
                required: [avatar_id]
                properties:
                  avatar_id:
                    type: string
                    format: uuid
        '400':
          description: Unsupported type, animated image, invalid crop, bad dimensions, or invalid form
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller may not change this picture (`avatar_changes_locked` or `forbidden`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: File larger than 5 MB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Family]
      summary: Remove a profile picture
      description: Same permission rules as upload. Removes the stored files.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      responses:
        '204':
          description: Picture removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/avatars/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Avatar UUID (the `avatar_id` from the member list).
        schema:
          type: string
          format: uuid
    get:
      tags: [Family]
      summary: Get a profile picture
      description: Requires a signed-in account, not a permission, so that a child can read their own picture (children lack `members.view`). The handler returns the picture only to active members of the same family. The wall display gets pictures through its own device route, which applies `show_avatars_on_wall`.
      security:
        - sessionCookie: []
      parameters:
        - name: size
          in: query
          required: false
          description: Output size in pixels.
          schema:
            type: integer
            enum: [96, 256]
            default: 256
      responses:
        '200':
          description: JPEG image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '400':
          description: Size is not 96 or 256
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/family/avatar-settings:
    get:
      tags: [Family]
      summary: Read profile picture settings
      description: Requires the `settings.view` permission.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Family]
      summary: Update profile picture settings
      description: Requires the `settings.manage` permission. Fields that are omitted keep their current value.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvatarSettings'
      responses:
        '200':
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarSettings'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/calendar/events:
    post:
      tags: [Calendar]
      summary: Create a local calendar event
      description: Requires the `calendar.manage` permission. A timed event needs `start_time` and `end_time` (HH:MM, local to `time_zone`), and it must end after it starts. An all-day event sends `start_time` and `end_time` as null. `end_date` is optional and defaults to `start_date`; it is the last day of the event and cannot be before `start_date`. `time_zone` is an IANA zone name. `recurrence_rule` is null for a one-off event, or a repeat rule in the same form as task repeats. Each member in `member_ids` must belong to the caller's family. The response carries an `ETag` header with the event version.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarEventRequest'
      responses:
        '201':
          description: Event created, with its ETag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEvent'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/calendar/events/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Event UUID.
        schema:
          type: string
          format: uuid
    get:
      tags: [Calendar]
      summary: Get a calendar event
      description: Needs `calendar.view`. At own level it reads only events the caller is a member of. An event the caller cannot see returns 404. Returns the series, its member list and its single-occurrence changes. The response carries an `ETag` header with the event version.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The event, with its ETag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Calendar]
      summary: Update a calendar event
      description: Requires the `calendar.manage` permission. Replaces the series and its members. Send `If-Match` with the current version to avoid overwriting a newer change. Single-occurrence changes are kept unless the rule is removed; a changed start date or zone can leave some of them without an occurrence.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarEventRequest'
      responses:
        '200':
          description: Updated event, with the new ETag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEvent'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/VersionConflict'
    delete:
      tags: [Calendar]
      summary: Delete a calendar event
      description: Requires the `calendar.manage` permission. Deletes the series with its members and every single-occurrence change. Send `If-Match` with the current version to avoid deleting a newer change.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Event deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/VersionConflict'
  /api/v1/calendar/events/{id}/occurrences/{date}:
    parameters:
      - name: id
        in: path
        required: true
        description: Event UUID.
        schema:
          type: string
          format: uuid
      - name: date
        in: path
        required: true
        description: Local date of the occurrence in the series (YYYY-MM-DD), as shown in `occurrence_date`.
        schema:
          type: string
          format: date
    put:
      tags: [Calendar]
      summary: Edit one occurrence of a repeating event
      description: Requires the `calendar.manage` permission. Changes this occurrence only. Editing a cancelled occurrence restores it as an edited one. The event must repeat (otherwise 409 with error code not_recurring), and the date must be an occurrence of the series (otherwise 404). Send `If-Match` with the current version. The response is the event with the new ETag.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarOccurrenceRequest'
      responses:
        '200':
          description: Event with the changed occurrence, and its new ETag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEvent'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The event does not repeat. Error code not_recurring.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          $ref: '#/components/responses/VersionConflict'
    delete:
      tags: [Calendar]
      summary: Cancel one occurrence of a repeating event
      description: Requires the `calendar.manage` permission. Removes this occurrence only; the rest of the series stays. The same rules as the edit apply to the event, the date and `If-Match`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Occurrence cancelled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The event does not repeat. Error code not_recurring.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          $ref: '#/components/responses/VersionConflict'
  /api/v1/calendar/range:
    get:
      tags: [Calendar]
      summary: List what is happening in a date range
      description: Returns event occurrences and task occurrences between `from` and `to`. Both dates are family-local dates (YYYY-MM-DD) and both are inclusive; the window can be at most 366 days. Events need `calendar.view`; at own level they show only events the caller is a member of. Tasks need `tasks.view`; at own level they show only task copies the caller is assigned. A caller without task permission gets events only, with no error. A `member_id` filter keeps items that include that member, so family-wide events with no members are left out. A `calendar_id` filter keeps events from that calendar only, and tasks are left out because they have no calendar. The list is sorted by start time, then kind, then key, so repeated calls return the same result.
      security:
        - sessionCookie: []
      parameters:
        - name: from
          in: query
          required: true
          description: First family-local date in the window (YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: Last family-local date in the window (YYYY-MM-DD). Cannot be before `from`.
          schema:
            type: string
            format: date
        - name: member_id
          in: query
          required: false
          description: Only items that include this family member.
          schema:
            type: string
            format: uuid
        - name: calendar_id
          in: query
          required: false
          description: Only events from this calendar. Use the `calendar_id` of an item, which is the import id for imported events and the local calendar id otherwise. Both kinds are accepted.
          schema:
            type: string
            format: uuid
        - name: tasks
          in: query
          required: false
          description: Set to false to leave out task occurrences. Defaults to true.
          schema:
            type: boolean
      responses:
        '200':
          description: Items in the window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarRangeResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/calendar/export.ics:
    get:
      tags: [Calendar]
      summary: Export the family calendar as an ICS file
      description: Requires the `calendar.view` permission. Returns every event in the family as an iCalendar file with a VTIMEZONE for the family time zone. Events in the 10 years from today are expanded, and recurring events keep their rule. Members whose `calendar.view` is at own level get 403, because the export covers the whole calendar.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The family calendar as an iCalendar file
          content:
            text/calendar:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/calendar/sources:
    get:
      tags: [Calendar]
      summary: List calendars
      description: Returns every manual calendar in the family, oldest first. The family's first calendar, named Default, is created on first use. Any signed-in member can read the list.
      responses:
        '200':
          description: The family's manual calendars
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CalendarSource'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Calendar]
      summary: Create a manual calendar
      description: Requires the `calendar.manage` permission. Creates an empty manual calendar that events can be assigned to. Name is required and must not be blank. Colour is required, as `#RRGGBB`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarSourceRequest'
      responses:
        '201':
          description: The created calendar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarSource'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/calendar/sources/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Calendar source UUID.
        schema:
          type: string
          format: uuid
    patch:
      tags: [Calendar]
      summary: Rename or recolour a calendar
      description: Requires the `calendar.manage` permission. Sets the calendar's name and colour. Name is required and must not be blank. Colour is required, as `#RRGGBB`. Only the family's own calendars can be edited; other calendars return 404.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarSourceRequest'
      responses:
        '200':
          description: The updated calendar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarSource'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Calendar]
      summary: Delete a calendar
      description: Requires the `calendar.manage` permission. Deletes the calendar and the events saved to it. Events brought in from an imported file keep their import and move to the family's oldest other calendar. The last remaining calendar cannot be deleted (409 `last_calendar`). Other families' calendars return 404.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      responses:
        '204':
          description: The calendar was deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/calendar/imports:
    get:
      tags: [Calendar]
      summary: List calendar imports
      description: Requires the `calendar.manage` permission. Returns every ICS import in the caller's family, oldest first. `event_count` counts the events that still exist, so it drops as events are deleted.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The family's imports
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarImportList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Calendar]
      summary: Import an ICS calendar file
      description: Requires the `calendar.manage` permission. Uploads an iCalendar (.ics) file of up to 10 MB and creates one import with its events. Each VEVENT with no RECURRENCE-ID becomes one event, and a repeating event keeps its rule. Supported repeats are DAILY, WEEKLY, MONTHLY and YEARLY with the date-level RFC 5545 parts; sub-daily frequencies and time-of-day parts are skipped and counted in `skipped_count`. Cancelled events and events whose time zone is unknown are skipped the same way. EXDATE values and cancelled or moved single occurrences are kept. Times without a zone, in UTC, and all-day events use the family time zone. Imported events are stored like local events and can be edited or deleted; deleting the import removes all of them. Each import has a colour and an audience. The colour and the people from the audience are copied onto each event when the import is made, and changing the import's audience later does not change existing events.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: An iCalendar file, at most 10 MB.
                name:
                  type: string
                  maxLength: 100
                  description: Name shown for the import. Defaults to the file name without its extension.
                colour:
                  type: string
                  pattern: '^#[0-9A-Fa-f]{6}$'
                  description: The colour of the import's events, as #RRGGBB. Defaults to #0D9488.
                audience:
                  type: string
                  enum: [everyone, specific, parents]
                  description: Who the events are for. Defaults to everyone. parents means the family's active parents when the import is made.
                show_on_wall:
                  type: boolean
                  description: Whether the import's events show on the wall display. Defaults to true. Saved per import; the wall display reads it when it is built.
                member_ids:
                  type: array
                  description: Repeat the field once per person. Required when audience is specific. Each id must be an active member of the family.
                  items:
                    type: string
                    format: uuid
      responses:
        '201':
          description: Import created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarImport'
        '400':
          description: The file is missing, is not a calendar, has more than 5000 events, or has no importable events (error codes missing_file, invalid_ics, too_many_events, no_events, or validation_failed for the name, colour, audience or member_ids). For no_events, params.skipped_count gives how many events were skipped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: The file is larger than 10 MB (error code file_too_large)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/calendar/imports/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Import UUID.
        schema:
          type: string
          format: uuid
    delete:
      tags: [Calendar]
      summary: Delete a calendar import
      description: Requires the `calendar.manage` permission. Deletes the import and every event it created, with their single-occurrence changes. An import from another family, or one that does not exist, returns 404.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      responses:
        '204':
          description: Import and its events deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Calendar]
      summary: Rename or recolour a calendar import
      description: Requires the `calendar.manage` permission. Sets the import's name, colour and settings. Name and colour are required. Omitted optional fields keep their stored value. The events it created read the name, colour, audience and wall setting from the import, so the new values show on them straight away. An import from another family, or one that does not exist, returns 404.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, colour]
              properties:
                name:
                  type: string
                  maxLength: 100
                  description: Name shown on the calendar list and in the calendar filter. Blank names are rejected.
                colour:
                  type: string
                  pattern: '^#[0-9A-Fa-f]{6}$'
                  description: Colour as #RRGGBB.
                audience:
                  type: string
                  enum: [everyone, specific, parents]
                  description: Who can see the events. 'specific' needs member_ids with at least one active member. 'parents' means the family's active parents.
                member_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: People the import is for when audience is specific.
                show_on_wall:
                  type: boolean
                  description: Whether the events appear on the wall display.
                refresh_minutes:
                  type: integer
                  enum: [15, 30, 60, 360, 1440]
                  description: How often a linked calendar is refreshed. Only used for linked calendars.
                paused:
                  type: boolean
                  description: When true, a linked calendar is not refreshed automatically. Manual sync still works.
      responses:
        '204':
          description: Import updated
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/calendar/imports/{id}/sync:
    parameters:
      - name: id
        in: path
        required: true
        description: Import UUID.
        schema:
          type: string
          format: uuid
    post:
      tags: [Calendar]
      summary: Sync a linked calendar now
      description: Requires the `calendar.manage` permission. Fetches the linked calendar now and stores the result. A failed fetch is not an error. The response is 200 with `last_sync_error` set, and the events it had are kept. Each linked calendar can be synced by hand at most once a minute, so a refused attempt returns 429 `sync_too_soon`. The scheduler also counts as an attempt. Every accepted sync is recorded in the audit log. An uploaded file import returns 400 `not_linked`. An import from another family, or one that does not exist, returns 404.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      responses:
        '200':
          description: Sync attempted; the import as it stands afterwards
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarImport'
        '400':
          description: The import was uploaded as a file and has no link to sync
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: The calendar was attempted within the last minute (`sync_too_soon`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/family/task-categories:
    get:
      tags: [Tasks]
      summary: List task categories
      description: Requires the `settings.view` permission. Categories are returned in sort order.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The family's categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTaskCategoriesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Tasks]
      summary: Create a task category
      description: Requires the `settings.manage` permission. A new category gets the next sort order after the existing ones. The response carries an `ETag` header with the category version.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCategoryRequest'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCategory'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A category with the same name (ignoring case) already exists. Error code name_taken, params.field is name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/family/task-categories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Category UUID.
        schema:
          type: string
          format: uuid
    put:
      tags: [Tasks]
      summary: Update a task category
      description: Requires the `settings.manage` permission. Omitted `sort_order` keeps the current order. Send `If-Match` with the current version to avoid overwriting a newer change.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCategoryRequest'
      responses:
        '200':
          description: Updated category, with the new ETag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCategory'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Another category already has this name. Error code name_taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          $ref: '#/components/responses/VersionConflict'
    delete:
      tags: [Tasks]
      summary: Delete a task category
      description: Requires the `settings.manage` permission. A category that templates or tasks use cannot be deleted unless `move_to` names another category in the family, which then takes over those rows. Otherwise the response is 409 with error code category_in_use and params `templates` and `tasks` (the counts).
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/IfMatch'
        - name: move_to
          in: query
          required: false
          description: Category UUID in the same family that receives the templates and tasks. Must not be the category being deleted.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Category deleted
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Category is in use and no move_to was given. Error code category_in_use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          $ref: '#/components/responses/VersionConflict'
  /api/v1/settings/diagnostics:
    get:
      tags: [Family]
      summary: Parent diagnostics (version, migrations, last backup, calendar sync)
      description: Requires the `settings.view` permission. Returns counts and times only. Calendar names, feed links and source error text are never included.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Diagnostics for the caller's family
          content:
            application/json:
              schema:
                type: object
                required: [version, uptime_seconds, migrations, last_backup, last_successful_backup_at, sync, email, wall_devices, server_errors]
                properties:
                  version:
                    type: string
                    description: Build version, `dev` for local builds.
                  uptime_seconds:
                    type: integer
                    description: Seconds since this API process started.
                  database_bytes:
                    type: integer
                    nullable: true
                    description: Size of the SQLite file, or null when it cannot be read.
                  migrations:
                    type: object
                    required: [applied, latest]
                    properties:
                      applied:
                        type: integer
                      latest:
                        type: string
                  last_backup:
                    nullable: true
                    description: Most recent backup attempt of any kind, or null when none exists.
                    type: object
                    properties:
                      kind:
                        type: string
                        enum: [scheduled, manual, before_reset]
                      status:
                        type: string
                        enum: [running, ok, failed]
                      finished_at:
                        type: string
                        format: date-time
                        nullable: true
                  last_successful_backup_at:
                    type: string
                    format: date-time
                    nullable: true
                  sync:
                    type: object
                    required: [linked_calendars, paused, failing]
                    properties:
                      linked_calendars:
                        type: integer
                        description: Calendars added from a link.
                      paused:
                        type: integer
                      failing:
                        type: integer
                        description: Linked calendars whose last sync failed.
                      last_synced_at:
                        type: string
                        format: date-time
                        nullable: true
                  email:
                    type: object
                    description: Outgoing email for the family. Counts only.
                    required: [pending, failed, sent_last_24h]
                    properties:
                      pending:
                        type: integer
                      failed:
                        type: integer
                      sent_last_24h:
                        type: integer
                  wall_devices:
                    type: object
                    description: Paired wall displays that have not been revoked.
                    required: [active]
                    properties:
                      active:
                        type: integer
                      last_seen_at:
                        type: string
                        format: date-time
                        nullable: true
                  server_errors:
                    type: object
                    description: 5xx responses since the process last started. This is not a rolling 24-hour window.
                    required: [since_start_count]
                    properties:
                      since_start_count:
                        type: integer
                      last_at:
                        type: string
                        format: date-time
                        nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/family/task-settings:
