  /api/v1/bonus-tasks:
    get:
      tags: [Bonus]
      summary: List bonus tasks
      description: Requires the bonus.manage or bonus.grab permission, otherwise 403. The scope query picks the family-local day, today by default. A parent gets every task in that scope with all of its claims. A child may only list today and gets the tasks offered to them, with their own claim in my_claim and taken_by_other set on a first_come task held by another child. A child asking for any other scope gets 403, and an unknown scope gets 400. State is derived from the clock on every read (scheduled, open, expired or cancelled). Expiry never writes a penalty.
      parameters:
        - name: scope
          in: query
          required: false
          description: Which day to list. Defaults to today.
          schema:
            type: string
            enum: [today, scheduled, past]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The tasks visible to the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BonusTaskList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Bonus]
      summary: Publish a bonus task
      description: Requires the bonus.manage permission. Children get 403. A task belongs to the family-local day given by day, which defaults to today. A task ends at ends_at, which defaults to the end of that day. A template_id must point at a bonus template and prefills the fields absent from the body. The response is 201 with the task.
      security:
        - sessionCookie: []
          csrfHeader: []
