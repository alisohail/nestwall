        show_from:
          type: string
          format: date-time
          nullable: true
        day:
          type: string
          format: date
          description: Family-local day the task belongs to, derived from ends_at.
        ends_at:
          type: string
          format: date-time
        state:
          type: string
          enum: [scheduled, open, expired, cancelled]
          description: Derived from the clock on every read. cancelled is set by a parent and is final.
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        version:
          type: integer
          minimum: 1
