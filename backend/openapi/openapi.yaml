          format: date-time
          nullable: true
        eligible_member_ids:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
    BonusClaim:
      type: object
      required: [id, bonus_task_id, family_member_id, status, claimed_at, version]
      properties:
        id:
          type: string
          format: uuid
        bonus_task_id:
          type: string
          format: uuid
        family_member_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [claimed, submitted, approved, rejected, released]
        claimed_at:
          type: string
          format: date-time
        released_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        decided_at:
          type: string
          format: date-time
          nullable: true
        decided_by_member_id:
          type: string
          format: uuid
          nullable: true
        decision_note:
          type: string
          nullable: true
        version:
          type: integer
          minimum: 1
    BonusClaimResult:
      allOf:
        - $ref: '#/components/schemas/BonusClaim'
        - type: object
          required: [replayed]
          properties:
            replayed:
              type: boolean
              description: True when the child already held the task.
    BonusTaskList:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/BonusTask'
    BonusDecisionRequest:
      type: object
      additionalProperties: false
      properties:
        decision_note:
          type: string
          maxLength: 200
          nullable: true
          description: Optional note on the decision. Trimmed before saving.
    DashboardMemberRef:
      type: object
      required: [member_id, member_name, member_colour, avatar_id]
      properties:
        member_id:
          type: string
          format: uuid
        member_name:
          type: string
        member_colour:
          type: string
          example: '#F59E0B'
        avatar_id:
          type: string
          format: uuid
          nullable: true
    MyTasksResponse:
      type: object
      required: [date, timezone, now, streak_days, summary, today, catch_up, waiting, expired]
      properties:
        date:
          type: string
          format: date
          description: Today in the family's time zone.
        timezone:
          type: string
          description: The family's IANA time zone.
        now:
          type: string
          format: date-time
        streak_days:
          type: integer
          minimum: 0
          description: Consecutive days, ending today or yesterday, on which every copy was done.
        summary:
          $ref: '#/components/schemas/MySummary'
        today:
          type: array
          items:
            $ref: '#/components/schemas/MyTaskItem'
        catch_up:
          type: array
          items:
            $ref: '#/components/schemas/MyTaskItem'
        waiting:
          type: array
          items:
            $ref: '#/components/schemas/MyTaskItem'
        expired:
          type: array
          description: Open copies whose occurrence was missed or whose grace period has ended. The child can view them but not act on them.
          items:
            $ref: '#/components/schemas/MyTaskItem'
    MyTasksPage:
      type: object
      required: [tasks, next_cursor]
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/MyTaskItem'
        next_cursor:
          type: string
          nullable: true
          description: Pass as cursor to read the next page. Null on the last page.
    MySummary:
      type: object
      required: [today_total, today_done, next_up]
      properties:
        today_total:
          type: integer
          description: Copies due today, including missed copies and not counting skipped copies.
        today_done:
          type: integer
          description: Copies due today that are submitted or approved.
        next_up:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/MyTaskItem'
    MyTaskItem:
      type: object
      description: One of the caller's copies. Penalty points are the amount deducted for a late completion when the task has a penalty.
      required: [task_id, title, due_date, due_at, points, approval_required, status, past_due, completed_late]
      properties:
        task_id:
          type: string
          format: uuid
          description: The occurrence ID. The task action endpoints use it.
        title:
          type: string
        category_emoji:
          type: string
          nullable: true
        category_colour:
          type: string
          nullable: true
        part_of_day:
          type: string
          nullable: true
          enum: [anytime, morning, after_school, evening]
        due_date:
          type: string
          format: date
        due_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        points:
          type: integer
          minimum: 0
        approval_required:
          type: boolean
        status:
          type: string
          enum: [to_do, submitted, approved, rejected]
        past_due:
          type: boolean
          description: True when the copy is still open and its due time has passed.
        completed_at:
          type: string
          format: date-time
          nullable: true
        completed_late:
          type: boolean
        late_points_percent:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
        penalty_value:
          type: integer
          minimum: 0
          nullable: true
        penalty_unit:
          type: string
          enum: [percent, points]
          nullable: true
        penalty_points:
          type: integer
          minimum: 0
          nullable: true
    DashboardSummary:
      type: object
      required: [today_total, today_done, overdue, waiting_approval]
      properties:
        today_total:
          type: integer
          description: Copies due today, not counting skipped copies.
        today_done:
          type: integer
          description: Copies due today that are approved.
        overdue:
          type: integer
          description: Copies still to do whose occurrence is past due.
        waiting_approval:
          type: integer
          description: Copies submitted and waiting for a parent.
    DashboardItem:
      type: object
      description: One person's copy of a task.
      required: [task_id, title, due_at, priority, status, member_id, member_name, member_colour, avatar_id]
      allOf:
        - $ref: '#/components/schemas/DashboardMemberRef'
      properties:
        task_id:
          type: string
          format: uuid
          description: The occurrence ID. The task action endpoints use it.
        title:
          type: string
        due_at:
          type: string
          format: date-time
        priority:
          type: string
          enum: [low, normal, high]
        status:
          type: string
          enum: [to_do, submitted, approved, rejected]
    DashboardPerson:
      type: object
      required: [member_id, member_name, member_colour, avatar_id, total, done]
      allOf:
        - $ref: '#/components/schemas/DashboardMemberRef'
      properties:
        total:
          type: integer
          description: Copies due today, not counting skipped copies.
        done:
          type: integer
          description: Copies due today that are approved.
        overdue:
          type: integer
          description: The person's to_do copies whose occurrence is past_due, on any date. The family total is summary.overdue.
    DashboardApproval:
      type: object
      required: [task_id, title, completed_at, completed_late, member_id, member_name, member_colour, avatar_id]
      allOf:
        - $ref: '#/components/schemas/DashboardMemberRef'
      properties:
        task_id:
          type: string
          format: uuid
        title:
          type: string
        completed_at:
          type: string
          format: date-time
        completed_late:
          type: boolean
    DashboardActivity:
      type: object
      description: One task event from the audit log. The member is the person who acted.
      required: [action, task_id, task_title, created_at, member_id, member_name, member_colour, avatar_id]
      allOf:
        - $ref: '#/components/schemas/DashboardMemberRef'
      properties:
        action:
          type: string
          enum: [task.completed, task.approved, task.rejected, task.skipped]
        task_id:
          type: string
          format: uuid
        task_title:
          type: string
        created_at:
          type: string
          format: date-time
    ShareSettings:
      type: object
      required: [enabled, min_per_share, max_per_share, daily_limit, min_balance, approval_mode, approval_above, notify_recipient, notify_parents, version]
      properties:
        enabled:
          type: boolean
          description: Points sharing is on for the family.
        min_per_share:
          type: integer
          description: Fewest points one share may send. Must not be more than `max_per_share`.
          minimum: 1
          maximum: 100000
        max_per_share:
          type: integer
          minimum: 1
          maximum: 100000
        daily_limit:
          type: integer
          description: Most points one child may send in one family day.
          minimum: 1
          maximum: 100000
        min_balance:
          type: integer
          description: The sender may not go below this balance after a share.
          minimum: 0
          maximum: 100000
        approval_mode:
          type: string
          enum: [never, above, always]
        approval_above:
          type: integer
          description: Used when `approval_mode` is `above`. A share above this amount waits for a parent.
          minimum: 0
          maximum: 100000
        notify_recipient:
          type: boolean
        notify_parents:
          type: boolean
        version:
          type: integer
          description: The policy version. 0 when no policy is stored yet.
    ShareSettingsRequest:
      type: object
      required: [enabled, min_per_share, max_per_share, daily_limit, min_balance, approval_mode, approval_above, notify_recipient, notify_parents]
      properties:
        enabled:
          type: boolean
        min_per_share:
          type: integer
          description: Fewest points one share may send. Must not be more than `max_per_share`.
          minimum: 1
          maximum: 100000
        max_per_share:
          type: integer
          minimum: 1
          maximum: 100000
        daily_limit:
          type: integer
          minimum: 1
          maximum: 100000
        min_balance:
          type: integer
          minimum: 0
          maximum: 100000
        approval_mode:
          type: string
          enum: [never, above, always]
        approval_above:
          type: integer
          minimum: 0
          maximum: 100000
        notify_recipient:
          type: boolean
        notify_parents:
          type: boolean
    ShareSummary:
      allOf:
        - $ref: '#/components/schemas/ShareSettings'
        - type: object
          required: [balance, shared_today, daily_left, notes, recipients]
          properties:
            balance:
              type: integer
              description: The caller's spendable balance.
            shared_today:
              type: integer
              description: Points the caller has sent today in the family time zone.
            daily_left:
              type: integer
              description: Points the caller may still send today.
            notes:
              type: array
              items:
                type: string
                enum: [thank_you, happy_birthday, good_job, just_because]
            recipients:
              type: array
              description: Active sibling children the caller may share with. Children cannot list family members, so the list comes with this summary.
              items:
                $ref: '#/components/schemas/ShareRecipient'
    ShareRecipient:
      type: object
      required: [member_id, name, colour, avatar_id]
      properties:
        member_id:
          type: string
          format: uuid
        name:
          type: string
        colour:
          type: string
        avatar_id:
          type: string
          format: uuid
          nullable: true
    ShareRequest:
      type: object
      required: [to_member_id, amount]
      properties:
        to_member_id:
          type: string
          format: uuid
          description: A sibling child in the same family.
        amount:
          type: integer
          minimum: 1
          maximum: 100000
        note_key:
          type: string
          description: Optional preset note. Leave it out to send no note. Send either note_key or note_text, not both.
          enum: [thank_you, happy_birthday, good_job, just_because]
        note_text:
          type: string
          maxLength: 200
          description: Optional custom note written by the child. Leave it out to send no note. Send either note_key or note_text, not both. Blank text counts as no note.
    PointShare:
      type: object
      required: [id, from_member_id, to_member_id, amount, note_key, note_text, status, approval_required, requested_at, decided_at, decided_by_member_id, version]
      properties:
        id:
          type: string
          format: uuid
        from_member_id:
          type: string
          format: uuid
        to_member_id:
          type: string
          format: uuid
        amount:
          type: integer
        note_key:
          type: string
          nullable: true
          enum: [thank_you, happy_birthday, good_job, just_because]
        note_text:
          type: string
          nullable: true
          maxLength: 200
        status:
          type: string
          enum: [pending, completed, declined]
        approval_required:
          type: boolean
        requested_at:
          type: string
          format: date-time
        decided_at:
          type: string
          format: date-time
          nullable: true
        decided_by_member_id:
          type: string
          format: uuid
          nullable: true
        version:
          type: integer
    ShareResult:
      allOf:
        - $ref: '#/components/schemas/PointShare'
        - type: object
          required: [balance, replayed]
          properties:
            balance:
              type: integer
              description: The sender's balance after this request.
            replayed:
              type: boolean
              description: True when the Idempotency-Key matched a stored share and nothing was written.
    ShareListItem:
      allOf:
        - $ref: '#/components/schemas/PointShare'
        - type: object
          required: [from_name, to_name]
          properties:
            from_name:
              type: string
            to_name:
              type: string
    ShareListPage:
      type: object
      required: [shares]
      properties:
        shares:
          type: array
          items:
            $ref: '#/components/schemas/ShareListItem'
    ParentDashboard:
      type: object
      required: [date, timezone, summary, today, people, approvals, activity]
      properties:
        date:
          type: string
          format: date
          description: Today in the family's time zone.
        timezone:
          type: string
          description: The family's IANA time zone.
        summary:
          $ref: '#/components/schemas/DashboardSummary'
        today:
          type: array
          items:
            $ref: '#/components/schemas/DashboardItem'
        people:
          type: array
          items:
            $ref: '#/components/schemas/DashboardPerson'
        approvals:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/DashboardApproval'
        activity:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/DashboardActivity'
