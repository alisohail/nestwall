  /api/v1/tasks/{id}/reopen:
    parameters:
      - name: id
        in: path
        required: true
        description: Task UUID.
        schema:
          type: string
          format: uuid
    post:
      tags: [Tasks]
      summary: Reopen a member's copy
      description: Requires the `tasks.manage` permission. Body names the member whose copy is reopened (`member_id`). An `approved`, `skipped` or `rejected` copy returns to `to_do`, and its completion and decision fields are cleared. A `to_do` copy whose occurrence was missed gets a new grace period, so the occurrence becomes `past_due` with a new expiry. Other cases return 409 invalid_transition. Send `If-Match` with the current version to avoid overwriting a newer change.
      security:
        - sessionCookie: []
          csrfHeader: []
