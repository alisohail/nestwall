        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/point-shares/{id}/approve:
    parameters:
      - name: id
        in: path
        required: true
        description: Share UUID.
        schema:
          type: string
          format: uuid
    post:
      tags: [Sharing]
      summary: Approve a pending share
      description: Requires the `rewards.approve` permission. Approval posts the recipient's `transfer_in` entry, so the points arrive now. Only a pending share can be approved (409 `not_pending`). An unknown share returns 404 `share_not_found`. Send `If-Match` with the current version to avoid a stale decision.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Approved share, with its new ETag
          headers:
            ETag:
              description: The new share version, quoted.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/VersionConflict'
  /api/v1/point-shares/{id}/decline:
    parameters:
      - name: id
        in: path
        required: true
        description: Share UUID.
        schema:
          type: string
          format: uuid
    post:
      tags: [Sharing]
      summary: Decline a pending share
      description: Requires the `rewards.approve` permission. The sender gets the held points back with a `transfer_in` entry that refers to the share. The recipient receives nothing. Only a pending share can be declined (409 `not_pending`). Send `If-Match` with the current version to avoid a stale decision.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Declined share, with its new ETag
          headers:
            ETag:
              description: The new share version, quoted.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/VersionConflict'
  /api/v1/redemptions:
    get:
      tags: [Rewards]
      summary: List reward requests
      description: |
        Requires the `rewards.view` permission. A child sees only their own requests and may not pass another `member_id` (403). A parent sees the whole family and may filter by `member_id`. `status` takes a comma-separated list of `pending`, `approved`, `rejected` and `cancelled`. Newest first, paged by keyset as for points entries.
      security:
        - sessionCookie: []
      parameters:
        - name: member_id
          in: query
          required: false
          description: Parents only. Limits the list to one member.
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          description: Comma-separated statuses, for example `pending,approved`.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Page size, 1 to 200. Default 50.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` value of the previous page.
          schema:
            type: string
      responses:
        '200':
          description: One page of requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedemptionPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/rewards:
    get:
      tags: [Rewards]
      summary: List rewards
      description: |
        Requires the `rewards.view` permission. Parents see every reward that is not archived, including inactive ones. Children see only active rewards that list them in `eligible_member_ids`, or any active reward when that list is empty. `in_window` is computed in the family time zone; it does not check points, limits or eligibility.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Rewards visible to the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RewardList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Rewards]
      summary: Create a reward
      description: Requires the `rewards.manage` permission. A new reward is active, has no limit, is open every day and is open to every child unless `eligible_member_ids` is set. Archived rewards are never deleted; use DELETE.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RewardRequest'
      responses:
        '201':
          description: Reward created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reward'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/rewards/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Reward UUID.
        schema:
          type: string
          format: uuid
    get:
      tags: [Rewards]
      summary: Get a reward
      description: Requires the `rewards.view` permission. Children get 404 for rewards they cannot see.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Reward, with its ETag (the version, quoted)
          headers:
            ETag:
              description: The reward version, quoted.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reward'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Rewards]
      summary: Update a reward
      description: |
        Requires the `rewards.manage` permission. Send only the fields to change: an absent field keeps its value and `null` clears an optional field (`description`, `limit_period`, `limit_count`, `available_from`, `available_until`, `available_days`). Archived rewards return 409 `reward_archived`. Send `If-Match` with the current version to avoid overwriting a newer change.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RewardRequest'
      responses:
        '200':
          description: Updated reward, with its new ETag
          headers:
            ETag:
              description: The new reward version, quoted.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reward'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/VersionConflict'
    delete:
      tags: [Rewards]
      summary: Archive a reward
      description: Requires the `rewards.manage` permission. Archiving hides the reward from children and from the list. The row is kept, so ledger history that refers to it stays valid. Archiving an archived reward returns 409 `reward_archived`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Archived reward, with its new ETag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reward'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/VersionConflict'
  /api/v1/rewards/{id}/redeem:
    parameters:
      - name: id
        in: path
        required: true
        description: Reward UUID.
        schema:
          type: string
          format: uuid
    post:
      tags: [Redemptions]
      summary: Request a reward
      description: |
        Requires the `rewards.redeem` permission and the `Idempotency-Key` header. The checks run in one transaction: the reward must be visible to the caller (active, not archived, and the caller is eligible), today must be inside its dates and weekdays, the family-zone limit (`day` or `week`, or `total`) must not be reached, and the balance must cover the cost. Limits count pending and approved requests only. The points are held at once as a negative `redemption` entry. A reward with `approval_required` false is approved at once; otherwise the request is `pending`. A replay with the same key and reward returns 200 with the stored request and changes nothing; the same key for another reward returns 409 `idempotency_conflict`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-generated key, up to 100 characters. Reuse it only when retrying the same request.
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Replay of an earlier request with the same key; the stored request is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedeemResult'
        '201':
          description: Request created (pending, or approved when no approval is required)
          headers:
            ETag:
              description: The request version, quoted.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedeemResult'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/redemptions/{id}/approve:
    parameters:
      - name: id
        in: path
        required: true
        description: Redemption UUID.
        schema:
          type: string
          format: uuid
    post:
      tags: [Redemptions]
      summary: Approve a pending redemption
      description: Requires the `rewards.approve` permission. Approval does not change points; they were held when the request was made. A parent cannot decide their own request (403 `own_redemption`). Only a pending request can be approved (409 `not_pending`). Send `If-Match` with the current version to avoid a stale decision.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Approved redemption, with its new ETag
          headers:
            ETag:
              description: The new request version, quoted.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RewardRedemption'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/VersionConflict'
  /api/v1/redemptions/{id}/reject:
    parameters:
      - name: id
        in: path
        required: true
        description: Redemption UUID.
        schema:
          type: string
          format: uuid
    post:
      tags: [Redemptions]
      summary: Reject a pending redemption
      description: Requires the `rewards.approve` permission. A reason is required. The held points are given back with a `redemption_reversal` entry. A parent cannot decide their own request (403 `own_redemption`). Only a pending request can be rejected (409 `not_pending`). Send `If-Match` with the current version to avoid a stale decision.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      responses:
        '200':
          description: Rejected request, with its new ETag. The points are back in the balance.
          headers:
            ETag:
              description: The new request version, quoted.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedeemResult'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/VersionConflict'
  /api/v1/redemptions/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        description: Redemption UUID.
        schema:
          type: string
          format: uuid
    post:
      tags: [Redemptions]
      summary: Cancel a pending redemption
      description: Requires the `rewards.redeem` permission. Only the member who asked can cancel, and only while the request is pending. Another member's request returns 404. The held points are given back. Send `If-Match` with the current version to avoid a stale cancel.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Cancelled request, with its new ETag. The points are back in the balance.
          headers:
            ETag:
              description: The new request version, quoted.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedeemResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/VersionConflict'
  /api/v1/badges:
    get:
      tags: [Badges]
      summary: Get badge settings
      description: Requires the `settings.view` permission. Returns the family's badge switches, the six built-in groups with their 24 badges, and the custom badges with award counts. The ETag is the settings version.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Badge configuration
          headers:
            ETag:
              description: Quoted settings version, for example "2".
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadgeConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/badges/settings:
    put:
      tags: [Badges]
      summary: Save the badge master switch and display options
      description: Requires the `settings.manage` permission. Send `If-Match` with the settings version to guard against a stale write. Returns the full configuration with the new ETag.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BadgeSettingsRequest'
      responses:
        '200':
          description: Saved; full configuration returned
          headers:
            ETag:
              description: Quoted new settings version.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadgeConfig'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/VersionConflict'
  /api/v1/badges/groups/{group}:
    parameters:
      - name: group
        in: path
        required: true
        description: One of the six built-in groups.
        schema:
          type: string
          enum: [streaks, points, tasks, skills, timing, kindness]
    put:
      tags: [Badges]
      summary: Switch a built-in group on or off
      description: Requires the `settings.manage` permission. Sets every badge in the group to the same state. Uses the settings version for `If-Match`. Returns the full configuration.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BadgeGroupRequest'
      responses:
        '200':
          description: Saved; full configuration returned
          headers:
            ETag:
              description: Quoted new settings version.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadgeConfig'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/VersionConflict'
  /api/v1/badges/custom:
    post:
      tags: [Badges]
      summary: Create a custom badge
      description: Requires the `settings.manage` permission. The new badge is on. `enabled` is ignored on create.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BadgeCustomRequest'
      responses:
        '201':
          description: Created
          headers:
            ETag:
              description: Quoted version of the new badge.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadgeCustom'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/badges/custom/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Custom badge UUID.
        schema:
          type: string
          format: uuid
    put:
      tags: [Badges]
      summary: Edit a custom badge
      description: Requires the `settings.manage` permission. Sends the full editable state, including `enabled`. Uses the badge's own version for `If-Match`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BadgeCustomRequest'
      responses:
        '200':
          description: Saved
          headers:
            ETag:
              description: Quoted new version of the badge.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadgeCustom'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/VersionConflict'
  /api/v1/badges/awards:
    post:
      tags: [Badges]
      summary: Award a custom badge by hand
      description: 'Requires the `rewards.manage` permission. Only custom badges can be awarded. The `Idempotency-Key` header is required (up to 100 characters). A new award returns 201; the same key with the same award returns 200 with `replayed: true`. Reusing a key for a different award returns 409.'
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
        - name: Idempotency-Key
          in: header
          required: true
          description: Unique key for this award, up to 100 characters.
          schema:
            type: string
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BadgeAwardRequest'
      responses:
        '200':
          description: Replayed; the stored award is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadgeAward'
        '201':
          description: Awarded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadgeAward'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  parameters:
    CSRFHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: Must equal the `nestwall-csrf` cookie value.
      schema:
        type: string
    MemberID:
      name: id
      in: path
      required: true
      description: Family member UUID.
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: The `version` the write is based on, quoted, for example "2" (a weak W/"2" is also accepted). A stale value returns 412. When the header is absent the write is not version-checked.
      schema:
        type: string
  headers:
    SessionCookie:
      description: HttpOnly, SameSite=Strict session cookie. Secure is set when the request is HTTPS or X-Forwarded-Proto is https.
      schema:
        type: string
        example: nestwall-session=<token>; Path=/; HttpOnly; SameSite=Strict
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: nestwall-session
      description: Session token issued by login or setup.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Double-submit CSRF token (must match the `nestwall-csrf` cookie).
    apiToken:
      type: http
      scheme: bearer
      description: Personal API token created in Settings > Integrations. It carries scopes and is revoked or expires independently of the session.
  responses:
    ValidationFailed:
      description: Input failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required or session invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The caller lacks the required permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CSRFInvalid:
      description: Missing or invalid CSRF token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found in the caller's family
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflicts with current state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    VersionConflict:
      description: The If-Match version is stale (error code version_conflict). Reload the data and try again. params.version holds the current version.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    BadgeSettings:
      type: object
      description: Family-wide badge switches.
      properties:
        enabled:
          type: boolean
          description: Master switch. When off, no badge is awarded.
        show_on_kid_dashboard:
          type: boolean
        notify_child:
          type: boolean
      required: [enabled, show_on_kid_dashboard, notify_child]
    BadgeSettingsRequest:
      type: object
      additionalProperties: false
      description: Full replacement of the badge switches.
      properties:
        enabled:
          type: boolean
        show_on_kid_dashboard:
          type: boolean
        notify_child:
          type: boolean
      required: [enabled, show_on_kid_dashboard, notify_child]
    BadgeGroupRequest:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
      required: [enabled]
    BadgeBuiltIn:
      type: object
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          example: first_task
        enabled:
          type: boolean
      required: [id, key, enabled]
    BadgeGroup:
      type: object
      properties:
        group:
          type: string
          enum: [streaks, points, tasks, skills, timing, kindness]
        enabled:
          type: boolean
          description: True only when every badge in the group is on.
        badges:
          type: array
          items:
            $ref: '#/components/schemas/BadgeBuiltIn'
      required: [group, enabled, badges]
    BadgeCustom:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 60
        emoji:
          type: string
          maxLength: 16
        description:
          type: string
          nullable: true
          maxLength: 200
        enabled:
          type: boolean
        version:
          type: integer
          minimum: 1
        awarded_count:
          type: integer
          minimum: 0
          description: Number of manual awards given so far.
      required: [id, name, emoji, description, enabled, version, awarded_count]
    BadgeCustomRequest:
      type: object
      additionalProperties: false
      description: Name and emoji are required. `enabled` is ignored on create.
      properties:
        name:
          type: string
          maxLength: 60
        emoji:
          type: string
          maxLength: 16
        description:
          type: string
          nullable: true
          maxLength: 200
        enabled:
          type: boolean
      required: [name, emoji]
    BadgeConfig:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
          description: Settings version. Send it as `If-Match` on settings and group writes.
        settings:
          $ref: '#/components/schemas/BadgeSettings'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/BadgeGroup'
        custom:
          type: array
          items:
            $ref: '#/components/schemas/BadgeCustom'
      required: [version, settings, groups, custom]
    BadgeAwardRequest:
      type: object
      additionalProperties: false
      properties:
        member_id:
          type: string
          format: uuid
          description: Active child member UUID.
        badge_id:
          type: string
          format: uuid
          description: Enabled custom badge UUID.
        note:
          type: string
          minLength: 1
          maxLength: 200
          description: Required reason, shown to the child.
      required: [member_id, badge_id, note]
    BadgeAward:
      type: object
      properties:
        id:
          type: string
          format: uuid
        member_id:
          type: string
          format: uuid
        badge_id:
          type: string
          format: uuid
        note:
          type: string
        awarded_at:
          type: string
          format: date-time
        replayed:
          type: boolean
          description: True when the Idempotency-Key matched an earlier award.
      required: [id, member_id, badge_id, note, awarded_at, replayed]
    MyBadges:
      type: object
      description: The signed-in child's badges.
      properties:
        enabled:
          type: boolean
          description: Family master switch.
        show_on_kid_dashboard:
          type: boolean
        earned_count:
          type: integer
          minimum: 0
        total_count:
          type: integer
          minimum: 0
          description: Badges shown, built-in and custom awards.
        groups:
          type: array
          items:
            $ref: '#/components/schemas/MyGroup'
        from_parents:
          type: array
          items:
            $ref: '#/components/schemas/MyAward'
      required: [enabled, show_on_kid_dashboard, earned_count, total_count, groups, from_parents]
    MyGroup:
      type: object
      properties:
        group:
          type: string
          enum: [streaks, points, tasks, skills, timing, kindness]
        earned:
          type: integer
          minimum: 0
          description: Earned badges shown in this group.
        total:
          type: integer
          minimum: 0
          description: Badges shown in this group.
        badges:
          type: array
          items:
            $ref: '#/components/schemas/MyBadge'
      required: [group, earned, total, badges]
    MyBadge:
      type: object
      properties:
        key:
          type: string
          example: first_task
        earned:
          type: boolean
        earned_at:
          type: string
          format: date-time
          nullable: true
        progress:
          type: integer
          minimum: 0
        target:
          type: integer
          minimum: 1
      required: [key, earned, earned_at, progress, target]
    MyAward:
      type: object
      description: A custom badge a parent gave the child by hand.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        emoji:
          type: string
        note:
          type: string
        awarded_by:
          type: string
          description: Display name of the parent who gave it.
        awarded_at:
          type: string
          format: date-time
      required: [id, name, emoji, note, awarded_by, awarded_at]
    RewardRequest:
      type: object
      additionalProperties: false
      description: Fields for a create (POST) or a partial update (PATCH). On create, `name` and `cost` are required.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Trimmed before it is checked.
        description:
          type: string
          nullable: true
          maxLength: 500
        icon:
          type: string
          maxLength: 16
        cost:
          type: integer
          minimum: 1
          maximum: 100000
        status:
          type: string
          enum: [active, inactive]
          description: Use inactive to pause a reward.
        approval_required:
          type: boolean
          description: Stored now; the approval flow for redemptions arrives in a later step.
        limit_period:
          type: string
          nullable: true
          enum: [day, week, month, total]
        limit_count:
          type: integer
          nullable: true
          minimum: 1
          maximum: 1000
        available_from:
          type: string
          format: date
          nullable: true
          description: First day the reward is open, in the family time zone.
        available_until:
          type: string
          format: date
          nullable: true
          description: Last day the reward is open, in the family time zone. Must not be before available_from.
        available_days:
          type: array
          nullable: true
          description: Weekdays the reward is open, as mon to sun (case-insensitive). Null or all seven days means every day.
          items:
            type: string
        eligible_member_ids:
          type: array
          description: Active child members who may see the reward. An empty list means every child.
          items:
            type: string
            format: uuid
    Limit:
      type: object
      required: [period, count]
      properties:
        period:
          type: string
          enum: [day, week, month, total]
        count:
          type: integer
    Reward:
      type: object
      required: [id, name, icon, cost, status, approval_required, eligible_member_ids, in_window, archived, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        icon:
          type: string
        cost:
          type: integer
        status:
          type: string
          enum: [active, inactive]
        limit:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Limit'
        approval_required:
          type: boolean
        available_from:
          type: string
          format: date
          nullable: true
        available_until:
          type: string
          format: date
          nullable: true
        available_days:
          type: array
          nullable: true
          items:
            type: string
        eligible_member_ids:
          type: array
          items:
            type: string
            format: uuid
        in_window:
          type: boolean
          description: True when the reward is active, not archived, and today (family time zone) is inside its dates and weekdays. It does not check points, limits or eligibility.
        archived:
          type: boolean
        version:
          type: integer
    MyPointsResponse:
      type: object
      required: [member_id, balance, reserved, timezone, week_start, today, week]
      properties:
        member_id:
          type: string
          format: uuid
        balance:
          type: integer
          description: Spendable points, after points held by pending requests.
        reserved:
          type: integer
          description: Points held by pending requests.
        timezone:
          type: string
          description: Family time zone (IANA name).
        week_start:
          type: string
          format: date
          description: Monday of the current week in the family time zone.
        today:
          type: integer
          minimum: 0
          maximum: 6
          description: Index of today in `week`, Monday is 0.
        week:
          type: array
          minItems: 7
          maxItems: 7
          description: Points earned per day, Monday first.
          items:
            type: integer
    MemberBalancesResponse:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/MemberBalance'
    MemberBalance:
      type: object
      required: [member_id, balance, reserved]
      properties:
        member_id:
          type: string
          format: uuid
        balance:
          type: integer
          description: Spendable points, after points held by pending requests.
        reserved:
          type: integer
          description: Points held by pending requests.
    PointsEntry:
      type: object
      required: [id, member_id, type, amount, created_at]
      properties:
        id:
          type: string
        member_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [task_award, bonus_task_award, bonus, penalty, redemption, redemption_reversal, reversal, adjustment, transfer_out, transfer_in]
        amount:
          type: integer
          description: Signed amount. Positive adds points, negative takes them.
        reason:
          type: string
          nullable: true
        reward_name:
          type: string
          nullable: true
          description: Set for redemption entries.
        created_at:
          type: string
          format: date-time
    PointsEntryPage:
      type: object
      required: [entries, next_cursor]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/PointsEntry'
        next_cursor:
          type: string
          nullable: true
          description: Pass as `cursor` to get the next page. Null on the last page.
    RedemptionListItem:
      allOf:
        - $ref: '#/components/schemas/RewardRedemption'
        - type: object
          required: [reward_name, reward_icon, member_name]
          properties:
            reward_name:
              type: string
            reward_icon:
              type: string
            member_name:
              type: string
              description: Display name of the requester.
    RedemptionPage:
      type: object
      required: [redemptions, next_cursor]
      properties:
        redemptions:
          type: array
          items:
            $ref: '#/components/schemas/RedemptionListItem'
        next_cursor:
          type: string
          nullable: true
          description: Pass as `cursor` to get the next page. Null on the last page.
    RewardList:
      type: object
      required: [rewards]
      properties:
        rewards:
          type: array
          items:
            $ref: '#/components/schemas/Reward'
    RewardRedemption:
      type: object
      required: [id, reward_id, member_id, status, cost, requested_at, version]
      properties:
        id:
          type: string
          format: uuid
        reward_id:
          type: string
          format: uuid
        member_id:
          type: string
          format: uuid
          description: The child who asked.
        status:
          type: string
          enum: [pending, approved, rejected, cancelled]
        cost:
          type: integer
          description: Points held when the request was made. Kept even if the reward changes later.
        requested_at:
          type: string
          format: date-time
        decided_at:
          type: string
          format: date-time
          nullable: true
          description: Null while pending or cancelled by the requester before a decision; set when approved, rejected or auto-approved.
        decided_by_member_id:
          type: string
          format: uuid
          nullable: true
        decision_reason:
          type: string
          nullable: true
          description: Set for rejections.
        version:
          type: integer
    RedeemResult:
      allOf:
        - $ref: '#/components/schemas/RewardRedemption'
        - type: object
          required: [balance, replayed]
          properties:
            balance:
              type: integer
              description: The member's balance after this request.
            replayed:
              type: boolean
              description: True when the request is a replay of an earlier request with the same key.
    DecisionRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 200
          description: Trimmed before it is checked. Required for rejection.
    PointsChangeRequest:
      type: object
      required: [type, points, reason]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [bonus, penalty, adjustment]
        points:
          type: integer
          description: Bonus and penalty are 1 to 100000. Adjustment is non-zero, between -100000 and 100000.
        reason:
          type: string
          minLength: 1
          maxLength: 200
    ReversePenaltyRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 200
    PointsEntryResponse:
      type: object
      required: [entry_id, type, amount, balance, replayed]
      properties:
        entry_id:
          type: string
        type:
          type: string
          enum: [bonus, penalty, adjustment, reversal]
        amount:
          type: integer
          description: Signed amount written to the ledger. A capped penalty is shown as the amount actually taken.
        balance:
          type: integer
          description: The member's balance after this entry.
        replayed:
          type: boolean
    CalendarSource:
      type: object
      description: A manual calendar. Events are assigned to one calendar each.
      required: [id, name, colour, event_count]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        colour:
          type: string
          description: Colour as #RRGGBB. Always set; the default calendar uses teal.
        event_count:
          type: integer
          description: Events saved to this calendar itself. Events placed on an imported or linked calendar are counted on that import instead.
    CalendarSourceRequest:
      type: object
      additionalProperties: false
      required: [name, colour]
      properties:
        name:
          type: string
          maxLength: 100
        colour:
          type: string
          description: '#RRGGBB.'
    CalendarEventRequest:
      type: object
      required: [title, time_zone, start_date]
      properties:
        calendar_id:
          type: string
          format: uuid
          nullable: true
          description: The calendar to save the event to. A manual calendar's id, or an imported (file) calendar's id. Linked calendars take no new events, so their id is accepted only when the event is already on that calendar. Omit it to keep the current calendar on update, or to use the family's first manual calendar on create. Imported and linked calendars take their people from their audience, so `member_ids` is ignored for them.
        title:
          type: string
          description: Event title. Required.
        description:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        all_day:
          type: boolean
        time_zone:
          type: string
          description: IANA zone name the event is made in, for example Europe/London.
        start_date:
          type: string
          format: date
          description: Local date of the first occurrence (YYYY-MM-DD).
        start_time:
          type: string
          nullable: true
          description: Local start time (HH:MM). Required for a timed event; null for an all-day event.
        end_date:
          type: string
          format: date
          nullable: true
          description: Last local date of the event. Defaults to start_date.
        end_time:
          type: string
          nullable: true
          description: Local end time (HH:MM). Required for a timed event; null for an all-day event.
        recurrence_rule:
          type: string
          nullable: true
          description: Repeat rule in the same form as task repeats. Null for a one-off event.
        member_ids:
          type: array
          description: Family members the event is for. An empty list means the whole family.
          items:
            type: string
            format: uuid
        reminders:
          type: array
          description: Reminders, as whole minutes before the start (0 means at the start). On a one-off event, reminders whose time has already passed are not kept. A repeating event keeps them for later occurrences.
          items:
            type: integer
            minimum: 0
            maximum: 40320
    CalendarOccurrenceRequest:
      type: object
      required: [title, start_date]
      description: The changed occurrence. The event's time zone and all-day setting stay as they are.
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        start_date:
          type: string
          format: date
        start_time:
          type: string
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        end_time:
          type: string
          nullable: true
    CalendarException:
      type: object
      description: A single-occurrence change. A cancelled occurrence has only occurrence_date and kind. An edited one carries its new values.
      required: [occurrence_date, kind]
      properties:
        occurrence_date:
          type: string
          format: date
        kind:
          type: string
          enum: [cancelled, edited]
        title:
          type: string
        description:
          type: string
        location:
          type: string
        start_date:
          type: string
          format: date
        start_time:
          type: string
        end_date:
          type: string
          format: date
        end_time:
          type: string
    CalendarEvent:
      type: object
      required: [id, title, all_day, time_zone, start_date, end_date, member_ids, version, exceptions]
      properties:
        calendar_id:
          type: string
          format: uuid
          description: The calendar the event is on. A manual calendar's id, or the import's id for an event placed on an imported or linked calendar.
        imported:
          type: boolean
          description: True when the event was written by a feed sync. Feed events are read-only. Events a user adds to an imported calendar have imported set to false and can be edited.
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        all_day:
          type: boolean
        time_zone:
          type: string
        start_date:
          type: string
          format: date
        start_time:
          type: string
          nullable: true
        end_date:
          type: string
          format: date
        end_time:
          type: string
          nullable: true
        recurrence_rule:
          type: string
          nullable: true
        member_ids:
          type: array
          items:
            type: string
            format: uuid
        version:
          type: integer
          description: The same value as the ETag header. Use it as If-Match on the next write.
        exceptions:
          type: array
          items:
            $ref: '#/components/schemas/CalendarException'
        reminders:
          type: array
          description: Reminder minutes before the start, smallest first.
          items:
            type: integer
    CalendarImport:
      type: object
      required: [id, name, kind, colour, audience, show_on_wall, member_ids, event_count, skipped_count, duplicate_count, refresh_minutes, paused, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum: [file, link]
          description: '`file` for an uploaded .ics, `link` for a calendar refreshed from a web address. The address itself is never returned.'
        refresh_minutes:
          type: integer
          enum: [15, 30, 60, 360, 1440]
          description: How often a linked calendar is refreshed. Stored for file imports too, but only linked calendars are refreshed.
        paused:
          type: boolean
          description: When true, a linked calendar is not refreshed automatically.
        last_synced_at:
          type: string
          format: date-time
          nullable: true
          description: When a linked calendar last fetched successfully. Null before the first successful fetch.
        last_sync_error:
          type: string
          nullable: true
          description: Why the last fetch of a linked calendar failed, as a short code. Null after a successful fetch.
        file_name:
          type: string
          nullable: true
          description: The uploaded file name, when it was sent.
        event_count:
          type: integer
          description: Events from this import that still exist.
        skipped_count:
          type: integer
          description: VEVENTs in the file that could not be imported.
        duplicate_count:
          type: integer
          description: Copies of an event (same UID) that were merged into the kept copy.
        colour:
          type: string
          pattern: '^#[0-9A-F]{6}$'
          description: The colour of the import's events, as an uppercase #RRGGBB value.
        audience:
          type: string
          enum: [everyone, specific, parents]
        show_on_wall:
          type: boolean
          description: Whether the import's events show on the wall display. Saved now; the wall display reads it when it is built.
        member_ids:
          type: array
          description: The people the events are for. Empty for everyone.
          items:
            type: string
            format: uuid
        created_at:
          type: string
          format: date-time
    CalendarImportList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CalendarImport'
    CalendarRangeResponse:
      type: object
      required: [from, to, time_zone, items, calendars]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        time_zone:
          type: string
          description: The family time zone. The window is cut on local dates in this zone.
        items:
          type: array
          items:
            $ref: '#/components/schemas/CalendarRangeItem'
        calendars:
          type: array
          description: Every calendar the caller can see at least one event from, whatever the window. Use it to offer a filter for each calendar.
          items:
            $ref: '#/components/schemas/CalendarRangeCalendar'
    CalendarRangeCalendar:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        colour:
          type: string
          description: The calendar colour. Omitted for the family's local calendar.
    CalendarRangeItem:
      type: object
      description: One event occurrence or one task occurrence. Event-only fields are omitted for tasks, and task-only fields are omitted for events.
      required: [key, kind, title, occurrence_date, starts_at, ends_at, all_day, time_zone, member_ids]
      properties:
        key:
          type: string
          description: Stable identifier. event:<event id>:<occurrence date> for an event, task:<occurrence id> for a task, birthday:<member id>:<occurrence date> for a birthday.
        kind:
          type: string
          enum: [event, task, birthday]
          description: A birthday comes from a member's date of birth. Its title is the member's name, it has no event id, it is always all day, and age is the age the member turns that day.
        age:
          type: integer
          description: Set for birthdays only.
        title:
          type: string
        occurrence_date:
          type: string
          format: date
          description: The family-local date the item belongs to. For a moved event occurrence this is still the date in the series.
        starts_at:
          type: string
          format: date-time
          description: RFC 3339 instant in UTC.
        ends_at:
          type: string
          format: date-time
          description: RFC 3339 instant in UTC. For a task this is the same as starts_at.
        all_day:
          type: boolean
        time_zone:
          type: string
        member_ids:
          type: array
          items:
            type: string
            format: uuid
        event_id:
          type: string
          format: uuid
        calendar_id:
          type: string
          format: uuid
        calendar_colour:
          type: string
          nullable: true
          description: The colour of an imported calendar's events. Absent for the family's own events, which take their colour from their members.
        calendar_name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        imported:
          type: boolean
          description: True when the event came from an imported calendar feed. Imported events are read-only here.
        reminders:
          type: array
          description: Minutes before the start that the event's reminders fire. Only set for events.
          items:
            type: integer
        recurring:
          type: boolean
        task_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [scheduled, past_due, missed]
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Machine-readable error code.
              enum:
                - bad_request
                - validation_failed
                - invalid_credentials
                - rate_limited
                - unauthenticated
                - session_invalid
                - unauthorized
                - forbidden
                - no_membership
                - csrf_invalid
                - not_found
                - conflict
                - not_recurring
                - name_taken
                - category_in_use
                - version_conflict
                - gone
                - setup_complete
                - user_id_taken
                - email_taken
                - invalid_role
                - method_not_allowed
                - DB_CONNECTION_FAILED
                - internal_error
              example: validation_failed
            message:
              type: string
              example: Invalid input
            params:
              type: object
              additionalProperties: true
              description: Optional details (for example field and reason for validation errors).
              example:
                field: password
                reason: min_length
    UserResponse:
      type: object
      required: [id, user_id, display_name, is_child]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          example: parent.one
        email:
          type: string
          nullable: true
        display_name:
          type: string
        is_child:
          type: boolean
        theme:
          type: string
          enum: [system, light, dark]
          description: The user's saved theme choice. `light` until they pick dark or system.
    FamilyMembership:
      type: object
      required: [member_id, family_id, family_name, timezone, role_id, role_name, is_parent, status, colour]
      properties:
        member_id:
          type: string
          format: uuid
          description: The caller's family member ID. Used with `/api/v1/family/members/{id}/avatar`.
        family_id:
          type: string
          format: uuid
        family_name:
          type: string
        timezone:
          type: string
          description: The family's IANA time zone, such as `Europe/London`. Dates such as "today" use it.
        time_format:
          type: string
          enum: ['12h', '24h']
          description: The family's clock style. `12h` shows AM/PM and `24h` shows 24-hour times. Defaults to `12h`.
          type: string
          format: uuid
        role_name:
          type: string
          example: Parent
        is_parent:
          type: boolean
          description: True when the caller's role is the fixed Parent role. Parents are prompted to set an email after sign-in.
        status:
          type: string
          example: active
        colour:
          type: string
          example: '#888888'
        avatar_id:
          type: string
          format: uuid
          nullable: true
          description: Profile picture ID for `/api/v1/avatars/{id}`, or null when none is set.
    SetupStatusResponse:
      type: object
      required: [setup_required]
      properties:
        setup_required:
          type: boolean
        message:
          type: string
    SetupParentRequest:
      type: object
      required: [user_id, password, display_name, email, family_name, timezone, locale]
      properties:
        user_id:
          type: string
          pattern: '^[a-zA-Z0-9._-]{3,32}$'
        password:
          type: string
          minLength: 8
          maxLength: 256
        display_name:
          type: string
          maxLength: 80
        email:
          type: string
          maxLength: 254
          description: Required for the first parent. Used to reset a forgotten password.
        family_name:
          type: string
          maxLength: 80
        timezone:
          type: string
          example: Europe/London
        locale:
          type: string
          example: en
    SetupParentResponse:
      type: object
      required: [user, family_id, message]
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'
        family_id:
          type: string
          format: uuid
        message:
          type: string
    LoginRequest:
      type: object
      required: [user_id, password]
      properties:
        user_id:
          type: string
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'
    MeResponse:
      type: object
      required: [user, family]
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'
        family:
          nullable: true
          description: The user's active membership in the installation's single family, or null when the user has none.
          allOf:
            - $ref: '#/components/schemas/FamilyMembership'
    MemberDetail:
      type: object
      required: [id, user_id, display_name, role_id, role_name, status, colour, is_child]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
        display_name:
          type: string
        role_id:
          type: string
          format: uuid
        role_name:
          type: string
        status:
          type: string
          example: active
        colour:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        is_child:
          type: boolean
        avatar_id:
          type: string
          format: uuid
          nullable: true
          description: Profile picture ID for `/api/v1/avatars/{id}`, or null when none is set.
        email:
          type: string
          nullable: true
          description: Account email, or null when none is set. Required for parents; optional for everyone else. Used for forgot-password.
        date_of_birth:
          type: string
          format: date
          nullable: true
          description: Birth date (YYYY-MM-DD), or null when not set. Not in the future.
        gender:
          type: string
          nullable: true
          enum: [female, male, prefer_not_to_say, null]
          description: Optional. Null when not set.
    AvatarSettings:
      type: object
      required: [members_can_change_avatar, show_avatars_on_wall]
      properties:
        members_can_change_avatar:
          type: boolean
          description: Whether members may change their own picture.
        show_avatars_on_wall:
          type: boolean
          description: Whether pictures are shown on the family wall.
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8
    ForgotPasswordRequest:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          example: parent.one
    ForgotPasswordEmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          maxLength: 254
          example: parent@example.com
    CompletePasswordResetRequest:
      type: object
      required: [token, new_password]
      properties:
        token:
          type: string
          description: The token from the emailed link.
        new_password:
          type: string
          description: The new password. Same rules as the rest of the app (at least 8 characters).
    ForgotPasswordResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [accepted, child, email_not_set_up]
          description: '`child` when the user ID belongs to an active child. `email_not_set_up` when the user is a parent whose family has no email set up yet, or, from the email route, when no family has email set up. Otherwise `accepted`, for unknown users and parents whose family is ready.'
    SessionView:
      type: object
      required: [id, user_agent, created_at, current]
      properties:
        id:
          type: string
          format: uuid
        user_agent:
          type: string
        created_at:
          type: string
          format: date-time
        current:
          type: boolean
          description: True for the session that made the request.
    ListSessionsResponse:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/SessionView'
    PermissionLevels:
      type: object
      description: Map of permission code to access level.
      additionalProperties:
        type: string
        enum: [full, view, own, request, allowed, denied]
    SetPermissionsRequest:
      type: object
      required: [permissions]
      properties:
        permissions:
          $ref: '#/components/schemas/PermissionLevels'
    CatalogueEntry:
      type: object
      required: [code, description, audience, levels]
      properties:
        code:
          type: string
          example: members.view
        description:
          type: string
        audience:
          type: string
          description: Which role types may hold this code. `any` for child and co-parent roles, `co_parent` for co-parent roles (and the Parent role), `parent` for the Parent role only.
          enum: [any, co_parent, parent]
        levels:
          type: array
          items:
            type: string
            enum: [full, view, own, request, allowed, denied]
    CatalogueResponse:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/CatalogueEntry'
    SaveResponse:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
          description: The version after the save. Use it as the next If-Match value.
    RoleView:
      type: object
      required: [id, name, description, role_type, is_fixed, permissions, defaults, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        role_type:
          type: string
          enum: [parent, co_parent, child]
          description: Parent is the fixed Parent role. A co_parent role may hold the co-parent parent-only codes. A child role may not hold any parent-only code.
        is_fixed:
          type: boolean
          description: Fixed roles (Parent) cannot be changed.
        is_built_in:
          type: boolean
          description: Seeded roles (Parent, Child) cannot be deleted. Custom roles are the rest.
        permissions:
          $ref: '#/components/schemas/PermissionLevels'
        defaults:
          $ref: '#/components/schemas/PermissionLevels'
        version:
          type: integer
          minimum: 1
          description: Optimistic concurrency version. Send it in If-Match on writes.
    ListRolesResponse:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleView'
    CreateRoleRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 40
        description:
          type: string
          maxLength: 200
        role_type:
          type: string
          enum: [child, co_parent]
          default: child
          description: Only a parent can create a co_parent role. Other values return 400.
    MemberPermissionsResponse:
      type: object
      required: [is_parent, permissions, version]
      properties:
        is_parent:
          type: boolean
          description: Parents always have full access.
        permissions:
          $ref: '#/components/schemas/PermissionLevels'
        version:
          type: integer
          minimum: 1
          description: Overrides version. Same value as the ETag header.
    NotificationView:
      type: object
      required: [id, kind, body, created_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          example: password_reset_request
        subject_member_id:
          type: string
          format: uuid
          nullable: true
        body:
          type: string
        created_at:
          type: string
          format: date-time
        read_at:
          type: string
          format: date-time
          nullable: true
    NotificationSettings:
      type: object
      description: One setting for the whole family.
      required: [in_app, browser, email, email_digest, digest_minutes, email_template]
      properties:
        in_app:
          type: boolean
          description: Off stops all notices. Nothing is stored for the bell.
        browser:
          type: boolean
          description: Show browser alerts while the app is open. Requires permission in the browser.
        email:
          type: boolean
          description: Send email to adults. Requires SMTP to be ready.
        email_digest:
          type: boolean
          description: Batch each parent's emails into one digest per interval. Default off.
        digest_minutes:
          type: integer
          minimum: 1
          maximum: 1440
          description: How often a digest may be sent, in minutes. Default 15. Only used when email_digest is on.
        email_template:
          type: string
          description: Custom email HTML. Empty means the built-in template.
    NotificationSettingsResponse:
      type: object
      required: [settings, default_template]
      properties:
        settings:
          $ref: '#/components/schemas/NotificationSettings'
        default_template:
          type: string
          description: The built-in email HTML, with placeholders.
    NotificationSettingsRequest:
      type: object
      required: [in_app, browser, email, email_digest, digest_minutes, email_template]
      additionalProperties: false
      properties:
        in_app: { type: boolean }
        browser: { type: boolean }
        email: { type: boolean }
        email_digest: { type: boolean }
        digest_minutes: { type: integer, minimum: 1, maximum: 1440 }
        email_template: { type: string }
    ListNotificationsResponse:
      type: object
      required: [notifications, unread_count, browser_enabled]
      properties:
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/NotificationView'
        unread_count:
          type: integer
          minimum: 0
        browser_enabled:
          type: boolean
          description: The family's browser alert switch. Clients only show browser alerts when this is true.
    ListMembersResponse:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/MemberDetail'
    UpdateMemberRequest:
      type: object
      description: All fields are optional. Only provided fields are changed.
      properties:
        role_id:
          type: string
          format: uuid
        display_name:
          type: string
          maxLength: 80
        colour:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        status:
