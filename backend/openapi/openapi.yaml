  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset
      description: Returns `child` when the user ID belongs to an active child, who must ask a parent to reset the password. Returns `accepted` for every other user ID, parent or unknown, so the endpoint cannot be used to find parent accounts. No email is sent yet (M7-04); a child's parents can be told with notify-parents.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/forgot-password/notify-parents:
    post:
      tags: [Auth]
      summary: Notify parents that a child needs a reset
      description: Creates one in-app notification for each active parent of the child's family. Answers the same way for any user ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: Request accepted
          content:
            application/json:
