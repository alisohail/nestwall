  /api/v1/tasks/{id}/checklist:
    parameters:
      - name: id
        in: path
        required: true
        description: Task UUID.
        schema:
          type: string
          format: uuid
    post:
      tags: [Tasks]
      summary: Add a checklist item
      description: Requires the `tasks.manage` permission. Appends an item to a one-off task's checklist. The step text is shared by everyone on the task, so it changes only while every assignee is `to_do` or `rejected`; otherwise the response is 409 checklist_locked (params.status). A missed or archived task returns 409. Send `If-Match` with the current version to avoid overwriting a newer change.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/IfMatch'
