        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChecklistTextRequest'
      responses:
        '201':
          description: Updated task with the new item, and its new ETag
          headers:
            ETag:
              description: The new task version, quoted.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Task not found in the caller's family.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The checklist is locked (checklist_locked, params.status), the time to complete has passed (task_missed), or the task is archived (task_archived).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          $ref: '#/components/responses/VersionConflict'
  /api/v1/tasks/{id}/checklist/{item}:
    parameters:
      - name: id
        in: path
        required: true
        description: Task UUID.
        schema:
          type: string
          format: uuid
      - name: item
        in: path
        required: true
        description: Checklist item UUID.
        schema:
          type: string
          format: uuid
    put:
      tags: [Tasks]
      summary: Tick or untick a checklist item
      description: Requires the `tasks.complete` permission. Sets one checklist item on a one-off task to done or not done for one person. The step text is shared by everyone assigned to the task, but the done state is kept per copy, so a tick changes only the copy it names. The copy checked is the signed-in member's own, or the copy named by `member_id` in the body; naming another member requires `tasks.manage` (403 forbidden otherwise). The checked copy must be `to_do` or `rejected`; otherwise the response is 409 checklist_locked (params.status). A missed occurrence returns 409 task_missed. Send `If-Match` with the current version to avoid overwriting a newer change.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChecklistTickRequest'
      responses:
        '200':
          description: Updated task, with its new ETag
          headers:
            ETag:
              description: The new task version, quoted.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Task or checklist item not found in the caller's family, or the caller is not assigned to the task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The checklist is locked for the caller (checklist_locked, params.status), the time to complete has passed (task_missed), or the task is archived (task_archived).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          $ref: '#/components/responses/VersionConflict'
    patch:
      tags: [Tasks]
      summary: Rename a checklist item
      description: Requires the `tasks.manage` permission. Changes the text of one item on a one-off task's checklist. The same lock and missed rules as adding an item apply. Send `If-Match` with the current version.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChecklistTextRequest'
      responses:
        '200':
          description: Updated task, with its new ETag
          headers:
            ETag:
              description: The new task version, quoted.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Task or checklist item not found in the caller's family.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The checklist is locked (checklist_locked, params.status), the time to complete has passed (task_missed), or the task is archived (task_archived).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          $ref: '#/components/responses/VersionConflict'
    delete:
      tags: [Tasks]
      summary: Remove a checklist item
      description: Requires the `tasks.manage` permission. Deletes one item from a one-off task's checklist. The same lock and missed rules as adding an item apply. Send `If-Match` with the current version.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Updated task, with its new ETag
          headers:
            ETag:
              description: The new task version, quoted.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Task or checklist item not found in the caller's family.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The checklist is locked (checklist_locked, params.status), the time to complete has passed (task_missed), or the task is archived (task_archived).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          $ref: '#/components/responses/VersionConflict'
