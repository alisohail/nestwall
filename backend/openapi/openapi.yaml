                $ref: '#/components/schemas/TaskTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Tasks]
      summary: Update a task template
      description: Requires the `tasks.manage` permission. Only the fields sent are changed; a null field clears it. Tasks created earlier from the template keep their values. Send `If-Match` with the current version to avoid overwriting a newer change.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
