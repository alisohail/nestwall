      summary: Edit a bonus task
      description: Requires the bonus.manage permission. Changes only the fields sent. Send day to move the task to another family-local day, which must be today or later and is given as YYYY-MM-DD. Send the task version as If-Match. A task with a claim returns 409 has_claims. A cancelled task returns 409 wrong_state, and an ended task returns 409 expired. A stale version returns 412. The response is 200 with the task and its ETag.
