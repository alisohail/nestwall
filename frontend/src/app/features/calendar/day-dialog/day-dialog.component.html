<div class="modal-bg" role="presentation" (click)="onBackdrop($event)">
  <div class="modal day-dialog" role="dialog" aria-modal="true" aria-labelledby="day-dialog-title" data-testid="day-dialog">
    <header class="day-head">
      <span class="dow">{{ weekday() }}</span>
      <span class="num" id="day-dialog-title" data-testid="day-dialog-num">{{ dayNumber() }}</span>
      <button type="button" class="icon-btn close" data-testid="day-close" [attr.aria-label]="'calendar.day.close' | transloco" (click)="closed.emit()">
        <app-icon name="close" [size]="18" />
      </button>
    </header>

    <ul class="items">
      @for (pill of pills(); track pill.key) {
        <li>
          <button
            type="button"
            class="item"
            data-testid="day-item"
            [class.task]="pill.task"
            [class.all-day]="pill.item.all_day"
            [style.--c]="pill.colour"
            (click)="picked.emit(pill)"
          >
            @if (pill.item.all_day) {
              <span class="bar" aria-hidden="true"></span>
              <span class="title">{{ pill.title }}</span>
            } @else {
              <span class="dot" aria-hidden="true"></span>
              <span class="time">{{ timeOf(pill) }}</span>
              <span class="title">{{ pill.title }}</span>
            }
          </button>
        </li>
      }
    </ul>
  </div>
</div>
