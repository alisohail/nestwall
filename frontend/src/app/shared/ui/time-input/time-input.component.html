<div class="time-field" [class.open]="open()" (focusout)="onFocusOut($event)">
  <input
    type="text"
    inputmode="numeric"
    autocomplete="off"
    class="select time-input"
    data-testid="time-trigger"
    aria-haspopup="dialog"
    [id]="inputId()"
    [attr.aria-expanded]="open()"
    [attr.aria-label]="label()"
    [attr.aria-describedby]="describedBy()"
    [attr.aria-invalid]="invalid() ? 'true' : null"
    [attr.placeholder]="twelveHour() ? 'h:mm' : 'HH:mm'"
    [value]="displayText()"
    [disabled]="disabled()"
    (click)="openPanel()"
    (focus)="openPanel()"
    (input)="onInput($any($event.target).value)"
    (blur)="commitText()"
    (keydown.enter)="onEnter()"
  />
  @if (open()) {
    <div class="time-scrim" aria-hidden="true" (click)="close()"></div>
    <div class="time-panel" role="dialog" data-testid="time-panel" [attr.aria-label]="label()">
      <div class="stepper">
        <div class="col">
          <button type="button" class="arrow" data-testid="time-hour-up" [attr.aria-label]="'common.time_hour_up' | transloco" (click)="stepHour(1)">▲</button>
          <div class="val" data-testid="time-hour-value">{{ hourSelect() || '--' }}</div>
          <button type="button" class="arrow" data-testid="time-hour-down" [attr.aria-label]="'common.time_hour_down' | transloco" (click)="stepHour(-1)">▼</button>
        </div>
        <div class="colon" aria-hidden="true">:</div>
        <div class="col">
          <button type="button" class="arrow" data-testid="time-minute-up" [attr.aria-label]="'common.time_minute_up' | transloco" (click)="stepMinute(1)">▲</button>
          <div class="val" data-testid="time-minute-value">{{ minute() || '--' }}</div>
          <button type="button" class="arrow" data-testid="time-minute-down" [attr.aria-label]="'common.time_minute_down' | transloco" (click)="stepMinute(-1)">▼</button>
        </div>
        @if (twelveHour()) {
          <div class="period-toggle" role="group" [attr.aria-label]="'common.time_period' | transloco">
            <button type="button" data-testid="time-period-AM" [attr.aria-pressed]="!pm()" [class.selected]="!pm()" (click)="setPeriod(false)">
              {{ 'common.time_am' | transloco }}
            </button>
            <button type="button" data-testid="time-period-PM" [attr.aria-pressed]="pm()" [class.selected]="pm()" (click)="setPeriod(true)">
              {{ 'common.time_pm' | transloco }}
            </button>
          </div>
        }
      </div>
      <div class="panel-actions">
        @if (hour()) {
          <button type="button" class="link" data-testid="time-clear" (click)="clear()">{{ 'common.time_clear' | transloco }}</button>
        }
        <button type="button" class="link" data-testid="time-done" (click)="close()">{{ 'common.time_done' | transloco }}</button>
      </div>
    </div>
  }
</div>
