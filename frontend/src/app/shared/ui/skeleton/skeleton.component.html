<div class="nw-skeleton" aria-hidden="true" data-testid="skeleton">
  @for (row of rowIndexes(); track row) {
    <div class="nw-skeleton__row">
      <span class="nw-skeleton__avatar"></span>
      <span class="nw-skeleton__lines">
        <span class="nw-skeleton__line nw-skeleton__line--wide"></span>
        <span class="nw-skeleton__line"></span>
      </span>
    </div>
  }
</div>
