<section class="own-password" data-testid="own-password">
  <h3>{{ 'account.password.heading' | transloco }}</h3>
  <p class="intro">{{ 'account.password.intro' | transloco }}</p>

  @if (error(); as message) {
    <app-banner tone="error" data-testid="own-password-error">{{ message | transloco }}</app-banner>
  }
  @if (done()) {
    <p class="saved" role="status" data-testid="own-password-saved">{{ 'account.password.saved' | transloco }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label class="field">
      <span>{{ 'account.password.current_label' | transloco }}</span>
      <input
        type="password"
        formControlName="current_password"
        autocomplete="current-password"
        data-testid="own-password-current" />
      @if (form.get('current_password')?.invalid && form.get('current_password')?.touched) {
        <span class="field-error" role="alert">{{ 'account.password.error.required' | transloco }}</span>
      }
    </label>

    <label class="field">
      <span>{{ 'login.change_password.new_label' | transloco }}</span>
      <input
        type="password"
        formControlName="new_password"
        autocomplete="new-password"
        data-testid="own-password-new" />
      <span class="hint">{{ 'login.change_password.hint' | transloco: { min: minLength } }}</span>
      @if (form.get('new_password')?.hasError('minlength') && form.get('new_password')?.touched) {
        <span class="field-error" role="alert">{{ 'login.change_password.error.too_short' | transloco }}</span>
      }
    </label>

    <label class="field">
      <span>{{ 'login.change_password.confirm_label' | transloco }}</span>
      <input
        type="password"
        formControlName="confirm_password"
        autocomplete="new-password"
        data-testid="own-password-confirm" />
      @if (form.hasError('mismatch') && form.get('confirm_password')?.touched) {
        <span class="field-error" role="alert">{{ 'login.change_password.error.mismatch' | transloco }}</span>
      }
    </label>

    <div class="foot">
      <button type="submit" class="btn primary" data-testid="own-password-submit" [disabled]="loading()">
        @if (loading()) {
          <app-loading variant="spinner" />
        } @else {
          {{ 'login.change_password.submit' | transloco }}
        }
      </button>
    </div>
  </form>
</section>
