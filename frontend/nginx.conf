server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Security headers (M8-02). They are set here, at the server level, so every response carries them: the static app,
    # the API proxy and the wall event stream. Locations below do not define their own add_header, so nothing overrides them.
    # style-src allows 'unsafe-inline' because templates use inline style attributes and Angular injects component styles.
    # Nothing is loaded from another origin, so every directive is limited to 'self' (and data:/blob: for images).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(), usb=()" always;

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The web app manifest needs its own MIME type for browsers to accept it as an installable manifest (M7-06).
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
    }

    # Proxy API requests to the backend service
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Restore from a copy of a backup file (M7-11b). The body is a whole archive, so this route gets the same 2 GB limit
    # as the API. The read timeout covers the upload and the swap before the API restarts.
    location = /api/v1/settings/backups/restore-upload {
        client_max_body_size 2g;
        proxy_read_timeout 10m;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # First-run restore (M7-11c). Same 2 GB limit and timeout as the restore upload above.
    location = /api/v1/setup/restore {
        client_max_body_size 2g;
        proxy_read_timeout 10m;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Live notification updates for the bell. Same stream rules as the wall events below.
    location = /api/v1/notifications/stream {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Live updates for wall displays (M6-06). The stream must reach the browser as it is written, so buffering and
    # caching are off, and the read timeout is longer than the 25-second heartbeat.
    location = /api/v1/wall/events {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
