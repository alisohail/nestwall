name: nestwall

services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        VERSION: ${NESTWALL_VERSION:-1.1.0}
    restart: unless-stopped
    environment:
      - API_PORT=${API_PORT:-8080}
      - APP_URL=${APP_URL:-http://localhost:5842}
      - DB_PATH=/app/database/nestwall.db
      - DB_KEY=${DB_KEY}
      - SESSION_SECRET=${SESSION_SECRET:-changeme-secret-change-in-production}
      # Scheduled backups are written inside the database/ mount (database/backups/).
      - BACKUP_DIR=/app/database/backups
      # Scheduled backups run at the saved hour in this zone (the family's zone, see .env.example).
      - TZ=${TZ:-America/Toronto}
    volumes:
      # The SQLite file is stored in the repo's database/ folder so it can be opened
      # with a SQLite tool (for example DB Browser for SQLite) while the API is stopped.
      - ../database:/app/database
    networks:
      - nestwall-net
    healthcheck:
      test: ["CMD", "/app/api", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VERSION: ${NESTWALL_VERSION:-1.1.0}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5842}:80"
    networks:
      - nestwall-net

networks:
  nestwall-net:
    driver: bridge
